name: Log archive

# Merge every leg's log artifact into one, so reading a run is one download instead of one per
# platform. Called as a job by ci.yml, debug.yml and matrix.yml after their legs have run.
#
# Each leg uploads `logs-part-<triplet>-<configs>` unconditionally (build-test.yml), so the
# archive covers failures *and* successes; without that, the run whose logs you want is
# exactly the one that has none.

on:
  workflow_call:
    inputs:
      label:
        description: Name for the archive, e.g. "ci", "debug", "matrix".
        required: true
        type: string

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      # Archival is best-effort here too: see the comment on the same step in
      # build-test.yml. A run with no logs is worth an annotation, not a red workflow that
      # makes every leg look suspect (issue #109).
      - name: Download every leg's log artifact
        id: download-logs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: logs-part-*
          path: all-logs
          merge-multiple: false

      - name: Say so when there was nothing to download
        if: steps.download-logs.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=log archive incomplete::no leg's log artifact could be downloaded; the merged archive will be empty."

      - name: Merge them into one archive
        shell: bash
        run: |
          set -euo pipefail
          # Create the directory first: when every leg failed at zero seconds (a workflow file
          # GitHub rejects, for instance) download-artifact creates nothing, and an `ls`-driven
          # tar would then fail - turning "there were no logs" into a second, misleading red.
          mkdir -p all-logs
          ls -R all-logs | head -n 60 || true
          tar -czf "${{ inputs.label }}-logs.tar.gz" -C all-logs .
          ls -lh "${{ inputs.label }}-logs.tar.gz"
          {
            echo "## Log archive"
            echo ""
            echo "One download for the whole run: \`${{ inputs.label }}-logs.tar.gz\`."
            echo ""
            echo '```'
            tar -tzf "${{ inputs.label }}-logs.tar.gz" | head -n 60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the merged archive
        id: upload-merged
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.label }}-logs
          path: ${{ inputs.label }}-logs.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Say so when the merged archive could not be uploaded
        if: steps.upload-merged.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=log archive missing::the merged log archive could not be uploaded to the artifact service; the legs' test results are unaffected."
