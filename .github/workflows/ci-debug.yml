name: ci debug

# push 默认跑 debug。2026-10-14：debug 首跑（run #38）六腿全红，失败清单已逐条修完
# （manifest/INCREMENTAL、旧头名、socket 预算、x64-osx arch 名、CRT、docstring 引号），
# 用户拍板**全部升硬门**（allow_failure: false）——开发期不对消费方承诺接口稳定，
# 红了就修，不再用 continue-on-error 掩盖。想跑 release：Actions 页面手工触发 ci release。
#
# ★ 2026-10-14 重构（路线 A 双份构建）：六腿全部改用 **vcpkg 自带标准 triplet**
#   （不设 VCPKG_BUILD_TYPE ⇒ port 编 Release + Debug 两份，debug 库进 debug/lib/），
#   消费端 -DCMAKE_BUILD_TYPE=Debug ⇒ 链的是 debug 编出来的 node 库。
#   原来的 x64-windows-static-clang 等自定义 triplet 与 test/cmake/{triplets,toolchains}
#   已整体删除 —— 消费端（含本工程）不再复刻任何工具链。
#   代价：依赖也按双份编 + port 多编一遍 Release，每腿约 +1～1.5 小时（用户已知情）。
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_REF: "2026.07.29"
  VCPKG_DISABLE_METRICS: "1"

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux
            triplet: x64-linux
            label: x64-linux (debug)
            vcpkg_conc: "4"
            allow_failure: "false"
            expect_arch: ""
          - os: ubuntu-24.04-arm
            preset: linux-arm64
            triplet: arm64-linux
            label: arm64-linux (debug)
            vcpkg_conc: "4"
            allow_failure: "false"
            expect_arch: ""
          - os: windows-latest
            preset: windows
            triplet: x64-windows-static
            label: x64-windows (debug)
            vcpkg_conc: "4"
            allow_failure: "false"
            expect_arch: x64
          - os: windows-11-arm
            preset: windows-arm64
            triplet: arm64-windows-static
            label: arm64-windows (debug)
            vcpkg_conc: "4"
            allow_failure: "false"
            expect_arch: ARM64
          - os: macos-latest
            preset: macos
            triplet: arm64-osx
            label: arm64-osx (debug)
            vcpkg_conc: "2"
            allow_failure: "false"
            expect_arch: ""
          - os: macos-15
            preset: macos-x64
            triplet: x64-osx
            label: x64-osx (debug)
            vcpkg_conc: "2"
            allow_failure: "false"
            expect_arch: ""
    uses: ./.github/workflows/platform.yml
    with:
      os: ${{ matrix.os }}
      preset: ${{ matrix.preset }}
      triplet: ${{ matrix.triplet }}
      label: ${{ matrix.label }}
      vcpkg_conc: ${{ matrix.vcpkg_conc }}
      allow_failure: ${{ matrix.allow_failure }}
      expect_arch: ${{ matrix.expect_arch }}
      debug: "1"
  logs:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: logs-part-*
          path: all-logs
          merge-multiple: false

      - name: 合成单个归档
        shell: bash
        run: |
          set -euo pipefail
          # head 会提前关管道 → 上游 tar/ls 收到 SIGPIPE 而非零退出；配合 pipefail 会让这一步
          # 整步失败（run #14 就是这么把 logs job 弄红的）。这里统一给 `|| true`。
          # ★ 六条腿**全部**在 0 秒处失败时（例如 workflow 文件本身被 GH 判非法），
          #   download-artifact 不会建出 all-logs ⇒ 下面的 tar 会失败、这一步整步红
          #   （2026-10-14 实测：logs job exit 2）。先建目录，让"没有平台日志"是**警告**而不是失败。
          mkdir -p all-logs
          ls -R all-logs | head -n 60 || true
          tar -czf ci-logs.tar.gz -C all-logs .
          ls -lh ci-logs.tar.gz
          {
            echo "## 日志归档"
            echo ""
            echo "下载 ci-logs artifact 即可拿到**全部平台**的日志（一个文件，目录名区分平台）。"
            echo ""
            echo '```'
            tar -tzf ci-logs.tar.gz | head -n 60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传汇总归档
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-logs.tar.gz
          if-no-files-found: error
          retention-days: 7
