name: Lint

# Checks that cost seconds. They guard the invariants that are easy to break and impossible
# to notice in review: a version file whose git-tree no longer matches the port, a tracked
# file that quietly picked up CRLF or CJK text, a patch a portfile still references after it
# was renamed.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install the lint dependencies
        run: python3 -m pip install pyyaml

      - name: Version files match the ports
        run: python3 tools/version_tree.py --check

      - name: Repository hygiene
        run: python3 tools/check_repo.py

      - name: The overlay table matches the ports
        # docs/overlay-replacements.md is what a consumer reads to learn what they will get by
        # depending on this port; it is prose, and prose drifts. The version columns are checked,
        # the sentences beside them are not - a tool cannot write "why this fork matters".
        run: python3 tools/overlay_table.py --check

      - name: No credentials in the history
        # The same scanner the pre-commit hook runs on staged lines, here over
        # every blob reachable from any ref. A hook is opt-in per clone, so
        # this is what makes the rule hold for the repository itself.
        run: python3 tools/check_secrets.py --all

      - name: Every workflow script still parses as shell
        # bash -n on each `run:` block. A workflow file parses as YAML and is
        # accepted by GitHub even when the script inside it is not valid shell:
        # the job runs, the step dies with "syntax error near unexpected token",
        # and the leg is red two hours into a build for a mistake a linter sees
        # in a second. The first run of the multi-configuration matrix failed
        # every leg exactly that way - after the tests had passed.
        run: python3 tools/check_workflows.py

      - name: The release watcher still parses the upstream feed
        run: python3 tools/node_release_watch.py --dry-run

      - name: The vcpkg release watcher still parses the upstream API
        run: python3 tools/vcpkg_release_watch.py --dry-run
