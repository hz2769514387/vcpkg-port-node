name: Debug configuration

# The Debug cell of the configuration matrix (issue #11), and the reason it is a workflow of
# its own rather than one more consumer configuration in ci.yml: Debug is a property of the
# *install*, not of the consumer. On Windows a Debug consumer compiles with the debug CRT
# (/MTd or /MDd) and _ITERATOR_DEBUG_LEVEL=2, and a Release library carries the release
# values, so the link ends in a wall of LNK2038. A Debug consumer therefore needs a Debug
# library, which means a dual triplet - and a dual triplet is a second Node.js build.
#
# Measured 2026-10-18 (ADR 0007): against a dual install, a Debug consumer links in ten
# seconds and runs; against a release-only install it cannot link at all.
#
# Why the stock triplet rather than a debug-only one: a debug-only triplet
# (`VCPKG_BUILD_TYPE=debug`) moves every install into `${prefix}/debug/...`, and seven ports
# in this port's dependency closure run post-install fixups against the non-debug layout and
# fail there - brotli, c-ares, libuv, ngtcp2, openssl, zstd, and this repository's own zlib
# overlay. A stock triplet with a Debug *consumer* reaches the same configuration with no
# overlay ports to maintain. The measurements are in issue #11.
#
# Runs on push as well as weekly: every dimension is verified on push, and keeping Debug in
# its own workflow is what keeps it inside the six-hour job limit.
#
# Six cells. Windows and macOS are one job each; the two Linux cells are three (a Release-only
# warm-up, the dual install, and the consumer), because a cold dual install does not fit a
# four-core runner in one job - see the note above those jobs and docs/ci.md.

on:
  push:
    branches:
      - main
      - "*_vcpkg-*"
  pull_request:
  schedule:
    - cron: '47 4 * * 1'
  workflow_dispatch:

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job per platform rather than a matrix - see the note in ci.yml. The same six cells as
  # ci.yml, with the Debug consumer instead of the Release one.
  windows:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: windows-2022
      preset: x64-windows-static
      triplet: x64-windows-static
      consumer-configs: Debug
      suite-configs: ""
      expect-arch: x64
      timeout-minutes: 330

  windows-arm64:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: windows-11-arm
      preset: arm64-windows-static
      triplet: arm64-windows-static
      consumer-configs: Debug
      suite-configs: ""
      expect-arch: ARM64
      timeout-minutes: 330

  # --- the Linux Debug cell, as three jobs per platform ------------------------------------
  # A port change invalidates the binary cache key (the key hashes ports/**), and a port change is
  # exactly when this cell is worth having. A cold round cannot build a dual install on a
  # four-core runner: measured 2026-10-21, run 39448354844 was cut at 350 minutes with the port's
  # Release half finished (1824/1824 targets) and Debug unfinished, while run 39500147659 - whose
  # dependencies came from a warm cache - needed 4h37m for the same install.
  #
  # So each platform is two calls rather than one. `*-warm` installs Release only
  # (VCPKG_BUILD_TYPE=release) to fill the binary cache; the leg that `needs:` it then installs
  # the dual triplet, where Release is a cache hit and only Debug is compiled. Each job stays
  # inside the six-hour ceiling even with a cold key.
  #
  # Two details that cost a round each to learn: the install tree crosses to the consumer job as
  # a tar (a zip artifact dropped the executable bit on the test suite's .bin/ada fixture, run
  # 39500147659), and the warm-up must not upload its tree (release-only, thrown away).
  linux-warm:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: ubuntu-latest
      preset: x64-linux
      triplet: x64-linux
      # Release, to match what a release-only install can serve: nothing is built here.
      consumer-configs: Release
      suite-configs: ""
      install-only: true
      install-timeout-minutes: 360

  linux:
    needs: linux-warm
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: ubuntu-latest
      preset: x64-linux
      triplet: x64-linux
      consumer-configs: Debug
      suite-configs: ""
      split-install: true
      install-timeout-minutes: 360
      timeout-minutes: 120

  linux-arm64-warm:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: ubuntu-24.04-arm
      preset: arm64-linux
      triplet: arm64-linux
      # Release, to match what a release-only install can serve: nothing is built here.
      consumer-configs: Release
      suite-configs: ""
      install-only: true
      install-timeout-minutes: 360

  linux-arm64:
    needs: linux-arm64-warm
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: ubuntu-24.04-arm
      preset: arm64-linux
      triplet: arm64-linux
      consumer-configs: Debug
      suite-configs: ""
      split-install: true
      install-timeout-minutes: 360
      timeout-minutes: 120

  macos:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: macos-latest
      preset: arm64-osx
      triplet: arm64-osx
      consumer-configs: Debug
      suite-configs: ""
      expect-arch: arm64
      timeout-minutes: 330

  macos-x64:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: macos-15
      preset: x64-osx
      triplet: x64-osx
      consumer-configs: Debug
      suite-configs: ""
      expect-arch: x86_64
      timeout-minutes: 330

  logs:
    needs: [windows, windows-arm64, linux-warm, linux, linux-arm64-warm, linux-arm64, macos, macos-x64]
    if: always()
    uses: ./.github/workflows/logs.yml
    secrets: inherit
    with:
      label: debug
