name: Debug configuration

# The Debug cell of the configuration matrix (issue #11), and the reason it is a workflow of
# its own rather than one more consumer configuration in ci.yml: Debug is a property of the
# *install*, not of the consumer. On Windows a Debug consumer compiles with the debug CRT
# (/MTd or /MDd) and _ITERATOR_DEBUG_LEVEL=2, and a Release library carries the release
# values, so the link ends in a wall of LNK2038. A Debug consumer therefore needs a Debug
# library, which means a dual triplet - and a dual triplet is a second Node.js build.
#
# Measured 2026-10-18 (ADR 0007): against a dual install, a Debug consumer links in ten
# seconds and runs; against a release-only install it cannot link at all.
#
# Why the stock triplet rather than a debug-only one: a debug-only triplet
# (`VCPKG_BUILD_TYPE=debug`) moves every install into `${prefix}/debug/...`, and seven ports
# in this port's dependency closure run post-install fixups against the non-debug layout and
# fail there - brotli, c-ares, libuv, ngtcp2, openssl, zstd, and this repository's own zlib
# overlay. A stock triplet with a Debug *consumer* reaches the same configuration with no
# overlay ports to maintain. The measurements are in issue #11.
#
# Runs on push as well as weekly: every dimension is verified on push, and keeping Debug in
# its own workflow is what keeps it inside the six-hour job limit.

on:
  push:
    branches:
      - main
      - "*_vcpkg-*"
  pull_request:
  schedule:
    - cron: '47 4 * * 1'
  workflow_dispatch:

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job per platform rather than a matrix - see the note in ci.yml. The same six cells as
  # ci.yml, with the Debug consumer instead of the Release one.
  windows:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: windows-2022
      preset: x64-windows-static
      triplet: x64-windows-static
      consumer-configs: Debug
      suite-configs: ""
      expect-arch: x64
      timeout-minutes: 330

  windows-arm64:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: windows-11-arm
      preset: arm64-windows-static
      triplet: arm64-windows-static
      consumer-configs: Debug
      suite-configs: ""
      expect-arch: ARM64
      timeout-minutes: 330

  linux:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: ubuntu-latest
      preset: x64-linux
      triplet: x64-linux
      consumer-configs: Debug
      suite-configs: ""
      timeout-minutes: 330

  linux-arm64:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: ubuntu-24.04-arm
      preset: arm64-linux
      triplet: arm64-linux
      consumer-configs: Debug
      suite-configs: ""
      timeout-minutes: 330

  macos:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: macos-latest
      preset: arm64-osx
      triplet: arm64-osx
      consumer-configs: Debug
      suite-configs: ""
      expect-arch: arm64
      timeout-minutes: 330

  macos-x64:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: macos-15
      preset: x64-osx
      triplet: x64-osx
      consumer-configs: Debug
      suite-configs: ""
      expect-arch: x86_64
      timeout-minutes: 330

  logs:
    needs: [windows, windows-arm64, linux, linux-arm64, macos, macos-x64]
    if: always()
    uses: ./.github/workflows/logs.yml
    secrets: inherit
    with:
      label: debug
