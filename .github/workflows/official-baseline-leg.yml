name: Official binary baseline (one leg)

# The reusable body of the baseline: upstream's own binary, upstream's own test suite for
# the pinned version, one GitHub-hosted Windows runner. What fails there is the answer to
# "is this the runner, or is it us" - the question the skip list (issue #21) and the arm64
# TLS crashes (issue #22) are both waiting on.
#
# Nothing here builds the port, and nothing here is a gate: the job's product is the step
# summary, which lists exactly what the official binary fails and crashes. The port's own
# legs stay the gate.
#
# The suite is the test/ and tools/ trees from the source tarball, which is byte for byte
# what the port installs into share/node/test-suite, so the two runs are comparable. The
# driver is run the way the port's own suite registration runs it - --flaky-tests=dontcare
# included, so an upstream flake does not read as a difference - and from the suite root,
# because the driver hands the shell a relative --test-reporter path.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner image to use.
        required: true
        type: string
      arch:
        description: "Architecture part of the distribution file name: x64 / arm64."
        required: true
        type: string
      suites:
        description: Space-separated suite directories under test/, e.g. "parallel".
        required: false
        type: string
        default: parallel
      timeout-minutes:
        description: The full parallel suite is the better part of an hour.
        required: false
        type: number
        default: 150

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Read the pinned Node.js version
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          # versions.json is the single source of truth for what this repository builds
          # against; a baseline of any other version would answer a different question.
          version="$(python -c 'import json;print(json.load(open("versions.json"))["node"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "official baseline: node v$version, ${{ inputs.arch }}"

      - name: Download the official binary and the suite
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.pins.outputs.version }}"
          root="$RUNNER_TEMP/baseline"
          mkdir -p "$root"
          # The package is named after the host platform, not the architecture: darwin-x64
          # for the macOS x64 leg, even though that runner is arm64 hardware executing the
          # binary under Rosetta 2 - which is exactly the kind of cell a baseline has to
          # measure rather than assume (issue: test-process-execve-throws died there with
          # SIGBUS once, and the question is whether that is this repository or Rosetta).
          case "${{ runner.os }}" in
            macOS)   pkg="node-v$version-darwin-${{ inputs.arch }}.tar.gz" ;;
            Windows) pkg="node-v$version-win-${{ inputs.arch }}.zip" ;;
            *) echo "official baseline: unsupported runner OS ${{ runner.os }}"; exit 1 ;;
          esac
          curl -fsSL -o "$root/node.pkg" \
            "https://nodejs.org/dist/v$version/$pkg"
          curl -fsSL -o "$root/node.tar.xz" \
            "https://nodejs.org/dist/v$version/node-v$version.tar.xz"
          # Python extracts the .tar.xz because Git Bash's tar has no xz on every image.
          # The whole tree, not just test/ and tools/: the suite reads files from all over
          # the source root - benchmark/compare.js, doc/api/cli.md, deps/npm/bin,
          # deps/v8 headers - and a partial extraction turns those into failures that
          # have nothing to do with the binary being measured (the first run failed 18
          # cases this way, 13 of them pure artifacts).
          python - "$root" <<'PY'
          import os, sys, tarfile, zipfile
          root = sys.argv[1]
          pkg = os.path.join(root, "node.pkg")
          # zip on Windows, tar.gz on macOS - the archive follows the host platform.
          if zipfile.is_zipfile(pkg):
              with zipfile.ZipFile(pkg) as z:
                  z.extractall(os.path.join(root, "binary"))
          else:
              with tarfile.open(pkg) as t:
                  t.extractall(os.path.join(root, "binary"), filter="data")
          with tarfile.open(os.path.join(root, "node.tar.xz")) as t:
              t.extractall(os.path.join(root, "suite"), filter="data")
          print("binary and suite extracted")
          PY
          ls "$root/binary" "$root/suite"

      - name: Run the suite with the official binary
        shell: bash
        run: |
          set -uo pipefail
          root="$RUNNER_TEMP/baseline"
          version="${{ steps.pins.outputs.version }}"
          case "${{ runner.os }}" in
            macOS)   shell_bin="$root/binary/node-v$version-darwin-${{ inputs.arch }}/bin/node" ;;
            Windows) shell_bin="$root/binary/node-v$version-win-${{ inputs.arch }}/node.exe" ;;
          esac
          # The working directory has to be the suite root, not this checkout: the driver
          # hands the shell `--test-reporter=./test/common/test-error-reporter.js`, a
          # relative path, so anything else resolves it against the wrong directory and
          # the reporter cases fail for a reason that has nothing to do with the binary.
          cd "$root/suite/node-v$version"
          # The exit code is deliberately not this step's: a failing suite is the
          # measurement, not an infrastructure error, and the summary step below is where
          # the result is read. `set +e` is not redundant with the script's own settings -
          # GitHub runs every bash step with -e already on the command line, so without
          # this the first failing test aborts the step and the log stops mid-suite.
          set +e
          python tools/test.py --shell="$shell_bin" --test-root=test \
            --flaky-tests=dontcare ${{ inputs.suites }} 2>&1 \
            | tee "$root/run.log"
          echo "driver exit code: ${PIPESTATUS[0]}"

      - name: Summarize the run
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/baseline/run.log"
          {
            echo "## Official node v${{ steps.pins.outputs.version }} on ${{ inputs.runner }} (${{ inputs.arch }})"
            echo ""
            echo '```'
            # The driver ends with one of "All tests passed." or "Failed tests:" plus a
            # command line per failure (tools/test.py, Main), and it prints one
            # "--- CRASHED ---" per crashed case. The progress line's trailing
            # "[+N|-N]" carries the pass and fail counts.
            tr '\r' '\n' < "$log" | grep -E "^\[[0-9:]+\|[% 0-9]+\|[+ 0-9]+\|- *[0-9]+\]" | tail -1 || true
            if grep -qE "^All tests passed\.$|^Failed tests:$" "$log"; then
              grep -E "^All tests passed\.$|^Failed tests:$" "$log"
            else
              # Neither line means the driver did not get as far as running tests - a
              # bad download, a missing interpreter - and the log's tail says which.
              echo "(the driver printed neither; it did not get as far as running tests)"
              tail -n 20 "$log"
            fi
            echo "crashed: $(grep -c -- "--- CRASHED ---" "$log" || true)"
            echo '```'
            echo ""
            echo "### Cases the official binary failed or crashed"
            echo '```'
            # The driver prints one "=== <label> ===" header followed by a "Path:" line
            # per failing case - the same shape as its own summary lines, which are
            # never followed by a Path, which is what separates the two here.
            awk '/^=== .* ===$/ { label = $0; getline; if ($0 ~ /^Path: /) print label }' "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
