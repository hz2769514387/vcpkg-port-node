name: Node.js test suite

# The slow gate. Node.js's own suite, run through its own driver, against the executable this
# repository's consumer project links from libnode. Weekly, and on demand.
#
# The whole point of this repository is that the result is still Node.js, so this is the test
# that actually decides it - it just cannot be the one that runs on every push.
#
# Release-only, like ci.yml: the suite is the delivery configuration's suite, and vcpkg's
# community `*-release` triplet halves a run that is already the better part of an hour.
# The same six cells as ci.yml.

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: node-suite-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # One job per platform rather than a matrix: a matrix on a job that calls a reusable
  # workflow produced a run with zero jobs and an "invalid workflow file" failure. See ci.yml.
  windows:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: windows-2022
      preset: x64-windows-static
      triplet: x64-windows-static-release
      config: Release
      expect-arch: x64
      ctest-options: -R node-suite

  windows-arm64:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: windows-11-arm
      preset: arm64-windows-static
      triplet: arm64-windows-static-release
      config: Release
      expect-arch: ARM64
      experimental: true
      ctest-options: -R node-suite

  linux:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: ubuntu-latest
      preset: x64-linux
      triplet: x64-linux-release
      config: Release
      experimental: true
      ctest-options: -R node-suite

  linux-arm64:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: ubuntu-24.04-arm
      preset: arm64-linux
      triplet: arm64-linux-release
      config: Release
      experimental: true
      ctest-options: -R node-suite

  macos:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: macos-latest
      preset: arm64-osx
      triplet: arm64-osx-release
      config: Release
      expect-arch: arm64
      ctest-options: -R node-suite

  macos-x64:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: macos-15
      preset: x64-osx
      triplet: x64-osx-release
      config: Release
      expect-arch: x86_64
      experimental: true
      ctest-options: -R node-suite

  logs:
    needs: [windows, windows-arm64, linux, linux-arm64, macos, macos-x64]
    if: always()
    uses: ./.github/workflows/logs.yml
    secrets: inherit
    with:
      label: node-suite
