name: Matrix

# The remaining dimensions of the build matrix (issue #11): the dynamic CRT on Windows, and a
# shared libnode on every platform. Both are ordinary vcpkg triplets - `*-windows-static-md`
# and the `*-dynamic` ones - so a consumer reaches them the same way they reach anything else.
#
# Why these are not legs of ci.yml: each one is a full extra install of the port, and putting
# them in one job would put that job over the six-hour limit. Split across workflows they run
# in parallel on push, which is what "verified on push" has to mean here.
#
# Four legs block a merge and four do not, and the split is a cost decision written down rather
# than a rule that grades itself:
#
#   blocking      windows-shared, windows-shared-arm64, linux-shared, linux-shared-arm64
#   non-blocking  windows-md, windows-md-arm64, macos-shared, macos-shared-x64
#
# The blocking four carry the claim no other leg carries - a *shared* libnode, which changes how the
# consumer finds the library at run time (rpath, DLL beside the executable) and what the exported
# config links. A regression there is silent until someone builds a shared install, so it should fail
# the pull request. They cost the pull request the slowest leg: 155 minutes for linux-shared-arm64 on
# the last all-green run (40025248617), the rest between 72 and 131.
#
# The non-blocking four are not less true, they are less distinct, and the maintainer chose not to
# spend the wall clock on them yet: `windows-md` differs from `windows-static` only in the CRT, which
# MSVC refuses to mix at link time anyway (LNK2038), and `macos-shared` repeats the shared claim on a
# platform whose shared story is the rpath this repository already tests through `ci.yml`'s macOS
# cells. Either moves to blocking by changing one line here and saying why.

on:
  push:
    branches:
      - main
      - "*_vcpkg-*"
    paths:
      - 'ports/**'
      - 'test/**'
      - 'tools/**'
      - '.github/**'
      - 'versions.json'
      - 'versions/**'
  pull_request:
    paths:
      - 'ports/**'
      - 'test/**'
      - 'tools/**'
      - '.github/**'
      - 'versions.json'
      - 'versions/**'
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job per cell rather than a matrix - see the note in ci.yml.
  #
  # Two consumer configurations per leg, Release and RelWithDebInfo, never Debug. The
  # triplets are release-only (`VCPKG_BUILD_TYPE=release`), which is what keeps eight
  # additional installs of the port inside the six-hour job limit, and a Debug consumer
  # cannot link a Release library on Windows at all - the exported config says so and
  # refuses at configure time. An earlier version of this file asked for Debug anyway, on
  # the assumption that these triplets were dual; six of the eight legs then failed in
  # `find_package` before building anything, which is how the assumption was found.
  #
  # Debug itself is covered for the static triplets by debug.yml, where the port is built
  # twice on purpose. Debug on a shared libnode or on the /MD CRT is therefore *not*
  # verified here - it needs a dual triplet, and that combination costs a second full
  # install. It is recorded in issue #11 rather than implied by a leg that passes.

  windows-md:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: windows-2022
      preset: x64-windows-static-md
      triplet: x64-windows-static-md-release
      consumer-configs: Release,RelWithDebInfo
      suite-configs: Release
      expect-arch: x64
      experimental: true
      timeout-minutes: 330

  windows-md-arm64:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: windows-11-arm
      preset: arm64-windows-static-md
      triplet: arm64-windows-static-md-release
      consumer-configs: Release,RelWithDebInfo
      suite-configs: Release
      expect-arch: ARM64
      experimental: true
      timeout-minutes: 330

  windows-shared:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: windows-2022
      preset: x64-windows
      triplet: x64-windows-release
      consumer-configs: Release,RelWithDebInfo
      suite-configs: Release
      expect-arch: x64
      timeout-minutes: 330

  windows-shared-arm64:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: windows-11-arm
      preset: arm64-windows
      triplet: arm64-windows-release
      consumer-configs: Release,RelWithDebInfo
      suite-configs: Release
      expect-arch: ARM64
      timeout-minutes: 330

  linux-shared:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: ubuntu-latest
      preset: x64-linux-dynamic
      triplet: x64-linux-dynamic-release
      consumer-configs: Release,RelWithDebInfo
      suite-configs: Release
      timeout-minutes: 330

  linux-shared-arm64:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: ubuntu-24.04-arm
      preset: arm64-linux-dynamic
      triplet: arm64-linux-dynamic-release
      consumer-configs: Release,RelWithDebInfo
      suite-configs: Release
      timeout-minutes: 330

  macos-shared:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: macos-latest
      preset: arm64-osx-dynamic
      triplet: arm64-osx-dynamic-release
      consumer-configs: Release,RelWithDebInfo
      suite-configs: Release
      expect-arch: arm64
      experimental: true
      timeout-minutes: 330

  macos-shared-x64:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: macos-15
      preset: x64-osx-dynamic
      triplet: x64-osx-dynamic-release
      consumer-configs: Release,RelWithDebInfo
      suite-configs: Release
      expect-arch: x86_64
      experimental: true
      timeout-minutes: 330

  logs:
    needs: [windows-md, windows-md-arm64, windows-shared, windows-shared-arm64,
            linux-shared, linux-shared-arm64, macos-shared, macos-shared-x64]
    if: always()
    uses: ./.github/workflows/logs.yml
    secrets: inherit
    with:
      label: matrix
