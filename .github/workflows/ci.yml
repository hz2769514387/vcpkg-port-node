# vcpkg-port-node 的 CI。
#
# 目标：
#   1. 在 GitHub Actions runner 上用**指定的 vcpkg 版本 2026.07.29**（不是 runner 预装的那个）
#      把本仓库的 overlay port 装起来；
#   2. 再用 test/ 里的消费端工程 find_package(node) + 链接 node::node + 真跑一段 JS；
#   3. 覆盖三个平台：x64-linux / x64-windows / arm64-osx。
#
# 资源是头号约束（标准 runner 只有 4C/16G/14G 可用磁盘、单 job 6h；macos arm64 更只有 3C/7G）：
#   * 先清 runner 预装的大件腾磁盘；
#   * `--clean-after-build`（每个包编完立即清 buildtrees/downloads/packages）；
#   * 只编 Release（VCPKG_BUILD_TYPE=release，避免 debug+release 双份）；
#   * 并发度收着用（VCPKG_MAX_CONCURRENCY），链接/重编译时内存尖峰不再叠乘。
# 真正的磁盘/耗时实测数据以本工作流的首次运行为准（见 docs/调研文档.md §4.5）。

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # 指定版本：与本地 C:\work\vcpkg-2026.07.29.zip 同源（该 Release 无二进制附件，用源码包自举）。
  VCPKG_REF: "2026.07.29"
  # 生产性/省资源相关的环境变量。
  VCPKG_DISABLE_METRICS: "1"
  VCPKG_BUILD_TYPE: "release"
  VCPKG_MAX_CONCURRENCY: "2"     # macos arm64 只有 3 核；linux/windows 也在 §4.5.2 的建议区间内

jobs:
  # ---------------------------------------------------------------------------
  # L1：静态校验（秒级、必跑）。不依赖编译，所以不受磁盘限制。
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 port 清单与必备文件
        shell: bash
        run: |
          set -euo pipefail
          for f in ports/node/vcpkg.json ports/node/portfile.cmake ports/node/usage; do
            test -f "$f" || { echo "缺文件：$f"; exit 1; }
          done
          python3 -c "import json,sys; json.load(open('ports/node/vcpkg.json'))" && echo "vcpkg.json JSON 合法"
          test -f versions/node.json -o -f versions/n-/node.json || { echo "缺 versions 版本库条目"; exit 1; }

      - name: vcpkg 版本库一致性（x-ci-verify-versions，参考性、非阻断）
        continue-on-error: true
        shell: bash
        run: |
          curl -L -o vcpkg.tar.gz "https://github.com/microsoft/vcpkg/archive/refs/tags/${VCPKG_REF}.tar.gz"
          mkdir -p "$RUNNER_TEMP/vcpkg-src"
          tar -xzf vcpkg.tar.gz -C "$RUNNER_TEMP/vcpkg-src" --strip-components=1
          "$RUNNER_TEMP/vcpkg-src/bootstrap-vcpkg.sh" -disableMetrics
          "$RUNNER_TEMP/vcpkg-src/vcpkg" x-ci-verify-versions --verbose

  # ---------------------------------------------------------------------------
  # L2 + L3：装依赖 + 编 port + 消费端冒烟。
  # ---------------------------------------------------------------------------
  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
            allow_failure: false
          - os: windows-latest
            triplet: x64-windows       # 对齐 vcpkg 默认：MSVC + 动态 CRT
            allow_failure: false
          - os: macos-latest         # arm64（3C/7G）
            triplet: arm64-osx
            # macOS 的 gyp 细节（哪些目标/动作存在、embedded 产物形态）无法在本地验证，
            # 首轮很可能需要迭代 —— 先允许失败，别挡住 linux/windows 的结论。
            allow_failure: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure }}
    steps:
      - uses: actions/checkout@v4

      # ---- 腾磁盘（各平台删预装大件）-----------------------------------------
      - name: 清理磁盘（Linux）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/share/swift /usr/local/lib/android/sdk || true
          sudo apt-get clean || true
          df -h

      - name: 清理磁盘（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # runner 预装了另一个版本的 vcpkg（C:\vcpkg）—— 我们要用自己的，顺手删掉省空间。
          Remove-Item -Recurse -Force C:\Android, C:\hostedtoolcache, C:\vcpkg, C:\tools\Android -ErrorAction SilentlyContinue
          Get-PSDrive C | Select-Object Used,Free

      - name: 清理磁盘（macOS）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo rm -rf ~/Library/Developer/CoreSimulator /Library/Developer/CoreSimulator || true
          rm -rf ~/Library/Caches/* || true
          df -h

      # ---- 装指定版本 vcpkg（2026.07.29）------------------------------------
      - name: 安装 vcpkg ${{ env.VCPKG_REF }}
        shell: bash
        run: |
          set -euo pipefail
          curl -L -o "$RUNNER_TEMP/vcpkg.tar.gz" \
            "https://github.com/microsoft/vcpkg/archive/refs/tags/${VCPKG_REF}.tar.gz"
          mkdir -p "$RUNNER_TEMP/vcpkg-src"
          tar -xzf "$RUNNER_TEMP/vcpkg.tar.gz" -C "$RUNNER_TEMP/vcpkg-src" --strip-components=1
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmd.exe //c "$(cygpath -w "$RUNNER_TEMP/vcpkg-src/bootstrap-vcpkg.bat")" -disableMetrics
          else
            "$RUNNER_TEMP/vcpkg-src/bootstrap-vcpkg.sh" -disableMetrics
          fi
          "$RUNNER_TEMP/vcpkg-src/vcpkg" version
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg-src" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/vcpkg-src" >> "$GITHUB_PATH"

      # ---- macOS：导出 gyp 变量环境（darwin-arm64）--------------------------
      #
      # gyp2vcpkg 需要每个平台一份"官方式变量环境"（= 官方二进制导出的 process.config）。
      # win/linux 两份已入库；macOS 这份按已授权方案在 mac runner 上现导出：
      # 取官方 darwin-arm64 的 node，把它 `process.config` 落成 env/darwin-arm64.json。
      # 有了它，port 构建期的 `gyp2vcpkg check` 会判定"片段没覆盖 mac 平台"→ 自动重新
      # 生成三平台片段（check 里的平台覆盖判据）。
      - name: 导出 macOS 变量环境（darwin-arm64）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          V="24.21.0"
          curl -L -o "$RUNNER_TEMP/node-darwin.tar.gz" \
            "https://nodejs.org/dist/v${V}/node-v${V}-darwin-arm64.tar.gz"
          mkdir -p "$RUNNER_TEMP/node-darwin"
          tar -xzf "$RUNNER_TEMP/node-darwin.tar.gz" -C "$RUNNER_TEMP/node-darwin" --strip-components=1
          "$RUNNER_TEMP/node-darwin/bin/node" -p "JSON.stringify(process.config, null, 2)" \
            > ports/node/gyp2vcpkg/env/darwin-arm64.json
          python3 -c "import json;d=json.load(open('ports/node/gyp2vcpkg/env/darwin-arm64.json'));print('variables:',len(d.get('variables',{})))"

      # ---- L2：装 port（含 16 个官方依赖）-----------------------------------
      - name: 装 node port（overlay）
        shell: bash
        run: |
          set -euo pipefail
          vcpkg install "node:${{ matrix.triplet }}" \
            --overlay-ports="$GITHUB_WORKSPACE/ports" \
            --clean-after-build
          df -h || true

      # ---- L3：消费端冒烟（find_package + 链接 + 真跑 JS）-------------------
      - name: 构建并运行消费端冒烟
        shell: bash
        run: |
          set -euo pipefail
          cmake -S test -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}" \
            -DVCPKG_MANIFEST_MODE=OFF
          cmake --build build
          SMOKE=./build/smoke
          [ -f "$SMOKE.exe" ] && SMOKE="$SMOKE.exe"
          OUT="$("$SMOKE" -e "process.stdout.write(process.versions.node)")"
          echo "嵌入运行时报告的 node 版本：$OUT"
          test "$OUT" = "24.21.0"