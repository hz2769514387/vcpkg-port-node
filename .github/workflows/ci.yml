# vcpkg-port-node 的 CI。
#
# 目标：
#   1. 在 GitHub Actions runner 上用**指定的 vcpkg 版本 2026.07.29**（不是 runner 预装的那个）
#      把本仓库的 overlay port 装起来；
#   2. 再用 test/ 里的消费端工程 find_package(node) + 链接 node::node + 真跑一段 JS；
#   3. 覆盖三个平台：x64-linux / x64-windows / arm64-osx。
#
# 平台口径（路线 B）：
#   * Windows：clang-cl + 静态 CRT + 静态库（x64-windows-static-clang）—— node 24+ 官方口径。
#   * Linux：gcc + 静态库（x64-linux）。
#   * macOS：clang + 静态库（arm64-osx）。
#   triplets 在 test/cmake/triplets/ 下，toolchains 在 test/cmake/toolchains/ 下。
#
# 资源策略：
#   只出 Release（triplet 里设 VCPKG_BUILD_TYPE=release）。
#   并发度收着用（VCPKG_MAX_CONCURRENCY=2）：macOS arm64 只有 3 核 / 7 GB。

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_REF: "2026.07.29"
  VCPKG_DISABLE_METRICS: "1"
  VCPKG_MAX_CONCURRENCY: "2"

jobs:
  # ---------------------------------------------------------------------------
  # L1：静态校验。
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 port 清单与必备文件
        shell: bash
        run: |
          set -euo pipefail
          for f in ports/node/vcpkg.json ports/node/portfile.cmake ports/node/usage; do
            test -f "$f" || { echo "缺文件：$f"; exit 1; }
          done
          python3 -c "import json;json.load(open('ports/node/vcpkg.json'))" && echo "vcpkg.json JSON 合法"
          test -f versions/n-/node.json || { echo "缺 versions/n-/node.json"; exit 1; }
          python3 -c "import json;json.load(open('versions/n-/node.json'))" && echo "versions 条目 JSON 合法"

      - name: versions 记录的 git-tree 与 ports/node 实际内容一致
        shell: bash
        run: |
          set -euo pipefail
          want="$(python3 -c "import json;print(json.load(open('versions/n-/node.json'))['versions'][0]['git-tree'])")"
          got="$(git rev-parse HEAD:ports/node)"
          echo "versions 里记的：$want"
          echo "HEAD 里的     ：$got"
          if [ "$want" != "$got" ]; then
            echo "::error::versions/n-/node.json 的 git-tree 与 ports/node 不一致"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # L2 + L3：装依赖 + 编 port + 消费端冒烟。
  # ---------------------------------------------------------------------------
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
            allow_failure: false
          - os: windows-latest
            triplet: x64-windows-static-clang
            allow_failure: false
          - os: macos-latest
            triplet: arm64-osx
            allow_failure: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure }}
    steps:
      - uses: actions/checkout@v4

      - name: 记录可用磁盘
        if: always()
        shell: bash
        run: df -h || true

      # ---- Windows：确保 clang-cl 可用 ----------------------------------------
      # GitHub Actions windows-latest 预装了 LLVM，但 VS 的 "C++ Clang 编译器" 组件
      # 不一定装了。toolchain 的搜索顺序会查 Program Files/LLVM，这里把它设到
      # NODE_PORT_LLVM_ROOT 以确保 toolchain 能找到。
      - name: 定位 clang-cl（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # VS 自带的 LLVM（优先：与 MSVC 头文件/库匹配）
          VS_LLVM=$(find "/c/Program Files/Microsoft Visual Studio" -path "*/VC/Tools/Llvm/x64/bin/clang-cl.exe" 2>/dev/null | head -1 || true)
          if [ -n "$VS_LLVM" ]; then
            LLVM_ROOT=$(dirname "$(dirname "$VS_LLVM")")
            echo "NODE_PORT_LLVM_ROOT=$LLVM_ROOT" >> "$GITHUB_ENV"
            echo "找到 VS 自带 LLVM：$LLVM_ROOT"
            exit 0
          fi
          # 独立 LLVM
          if [ -f "/c/Program Files/LLVM/bin/clang-cl.exe" ]; then
            echo "NODE_PORT_LLVM_ROOT=/c/Program Files/LLVM" >> "$GITHUB_ENV"
            echo "找到独立 LLVM"
            exit 0
          fi
          echo "::error::找不到 clang-cl，需要安装 LLVM 或 VS 的 C++ Clang 组件"
          exit 1

      # ---- 装指定版本 vcpkg --------------------------------------------------
      - name: 安装 vcpkg ${{ env.VCPKG_REF }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -L -o vcpkg.tar.gz \
            "https://github.com/microsoft/vcpkg/archive/refs/tags/${VCPKG_REF}.tar.gz"
          mkdir -p vcpkg-src
          tar -xzf vcpkg.tar.gz -C vcpkg-src --strip-components=1
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmd.exe //c "$(cygpath -w "$RUNNER_TEMP/vcpkg-src/bootstrap-vcpkg.bat")" -disableMetrics
          else
            ./vcpkg-src/bootstrap-vcpkg.sh -disableMetrics
          fi
          ./vcpkg-src/vcpkg version
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg-src" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/vcpkg-src" >> "$GITHUB_PATH"

      # ---- L2：装 port（含 16 个官方依赖）-----------------------------------
      - name: 装 node port（overlay）
        shell: bash
        run: |
          set -euo pipefail
          vcpkg install "node:${{ matrix.triplet }}" \
            --overlay-ports="$GITHUB_WORKSPACE/ports" \
            --overlay-triplets="$GITHUB_WORKSPACE/test/cmake/triplets"

      - name: 失败时打印首错
        if: failure()
        shell: bash
        run: |
          for f in "$VCPKG_ROOT"/buildtrees/node/*-out.log; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            grep -n -m 25 -E "error:|fatal error|^FAILED|Error [0-9]+" "$f" || tail -n 60 "$f"
          done
          for f in "$VCPKG_ROOT"/buildtrees/node/config-*-out.log; do
            [ -f "$f" ] || continue
            echo "===== $f（tail 120）====="
            tail -n 120 "$f"
          done

      - name: 收集日志
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          for f in "$VCPKG_ROOT"/buildtrees/node/*.log; do
            [ -f "$f" ] && cp "$f" "$RUNNER_TEMP/ci-logs/$(basename "$f")"
          done
          ls -la "$RUNNER_TEMP/ci-logs" || true

      - name: 上传日志 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-${{ matrix.triplet }}
          path: ${{ runner.temp }}/ci-logs
          if-no-files-found: ignore
          retention-days: 7

      # ---- L3：消费端冒烟（find_package + 链接 + 真跑 JS）-------------------
      - name: 构建并运行消费端冒烟
        shell: bash
        run: |
          set -euo pipefail
          cmake -S test -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}" \
            -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/test/cmake/triplets" \
            -DVCPKG_OVERLAY_PORTS="$GITHUB_WORKSPACE/ports" \
            -DVCPKG_MANIFEST_MODE=OFF
          cmake --build build
          SMOKE=./build/app/smoke
          [ -f "$SMOKE.exe" ] && SMOKE="$SMOKE.exe"
          OUT="$("$SMOKE" -e "process.stdout.write(process.versions.node)")"
          echo "嵌入运行时报告的 node 版本：$OUT"
          test "$OUT" = "24.21.0"