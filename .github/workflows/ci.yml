name: CI

# The fast gate: build the port through its own consumer test project and run everything that
# is cheap enough to run on every push. The Debug configuration and Node.js's own suite are
# separate workflows, because each of them costs far more per run.
#
# During the development period this branch is allowed to be red; the point is that the
# signal is honest (AGENTS.md, section 5).

on:
  push:
    branches:
      - main
      # Maintained lines (docs/versioning.md): a branch that is still supported has to be
      # still built. `legacy/*` is deliberately absent - those are frozen, unmaintained, and
      # may not build at all.
      - "*_vcpkg-*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job per platform rather than a matrix: a job that calls a reusable workflow takes
  # neither a matrix nor continue-on-error (either one is accepted by the parser and then
  # produces a run with zero jobs), so the legs are spelled out and 'experimental' is passed
  # into the called workflow, which applies it to its own job. The steps still live once in
  # build-test.yml.
  #
  # Six legs: both architectures on each of the three platforms the manifest claims.
  # macOS x64 is a cross build from an arm64 image (see the x64-osx preset), which is why
  # that leg also needs the Rosetta guard and the Mach-O architecture assertion.
  #
  # Release-only, and that is the whole point: with VCPKG_BUILD_TYPE unset the port builds
  # Release *and* Debug, which doubled every leg and pushed the Linux leg past the 5-hour job
  # limit. The `*-release` names are vcpkg's own community triplets.
  windows:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: windows-2022
      preset: x64-windows-static
      triplet: x64-windows-static-release
      config: Release
      expect-arch: x64
      ctest-options: -LE node-suite

  windows-arm64:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: windows-11-arm
      preset: arm64-windows-static
      triplet: arm64-windows-static-release
      config: Release
      expect-arch: ARM64

      ctest-options: -LE node-suite

  linux:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: ubuntu-latest
      preset: x64-linux
      triplet: x64-linux-release
      config: Release

      ctest-options: -LE node-suite

  linux-arm64:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: ubuntu-24.04-arm
      preset: arm64-linux
      triplet: arm64-linux-release
      config: Release

      ctest-options: -LE node-suite

  macos:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: macos-latest
      preset: arm64-osx
      triplet: arm64-osx-release
      config: Release
      expect-arch: arm64
      ctest-options: -LE node-suite

  macos-x64:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: macos-15
      preset: x64-osx
      triplet: x64-osx-release
      config: Release
      expect-arch: x86_64

      ctest-options: -LE node-suite

  # One archive with every leg's logs, instead of one artifact per platform.
  logs:
    needs: [windows, windows-arm64, linux, linux-arm64, macos, macos-x64]
    if: always()
    uses: ./.github/workflows/logs.yml
    secrets: inherit
    with:
      label: ci
