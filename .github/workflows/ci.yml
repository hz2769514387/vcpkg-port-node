# vcpkg-port-node 的 CI。
#
# 目标：
#   1. 在 GitHub Actions runner 上用**指定的 vcpkg 版本 2026.07.29**（不是 runner 预装的那个）
#      把本仓库的 overlay port 装起来；
#   2. 再用 test/ 里的消费端工程 find_package(node) + 链接 node::node + 真跑一段 JS；
#   3. 覆盖六个平台：win/linux/mac × x64/arm64。
#
# 平台口径（路线 B）：
#   * Windows：clang-cl + 静态 CRT + 静态库（x64/arm64-windows-static-clang）—— node 24+ 官方口径。
#   * Linux：gcc + 静态库（x64/arm64-linux）。
#   * macOS：clang + 静态库（x64/arm64-osx）。
#   triplets 在 ports/node/cmake/triplets/ 下，toolchains 在 ports/node/cmake/toolchains/ 下。
#
# 策略：
#   只编译 test（清单模式自动装依赖），不做单独的 vcpkg install。
#   只出 Release（triplet 里设 VCPKG_BUILD_TYPE=release）。
#   并发度收着用（VCPKG_MAX_CONCURRENCY=2）：macOS arm64 只有 3 核 / 7 GB。

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_REF: "2026.07.29"
  VCPKG_DISABLE_METRICS: "1"
  VCPKG_MAX_CONCURRENCY: "2"

jobs:
  # ---------------------------------------------------------------------------
  # L1：静态校验。
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 port 清单与必备文件
        shell: bash
        run: |
          set -euo pipefail
          for f in ports/node/vcpkg.json ports/node/portfile.cmake ports/node/usage; do
            test -f "$f" || { echo "缺文件：$f"; exit 1; }
          done
          python3 -c "import json;json.load(open('ports/node/vcpkg.json'))" && echo "vcpkg.json JSON 合法"
          test -f versions/n-/node.json || { echo "缺 versions/n-/node.json"; exit 1; }
          python3 -c "import json;json.load(open('versions/n-/node.json'))" && echo "versions 条目 JSON 合法"

      - name: versions 记录的 git-tree 与 ports/node 实际内容一致
        shell: bash
        run: |
          set -euo pipefail
          want="$(python3 -c "import json;print(json.load(open('versions/n-/node.json'))['versions'][0]['git-tree'])")"
          got="$(git rev-parse HEAD:ports/node)"
          echo "versions 里记的：$want"
          echo "HEAD 里的     ：$got"
          if [ "$want" != "$got" ]; then
            echo "::error::versions/n-/node.json 的 git-tree 与 ports/node 不一致"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # L2 + L3：编译 test（清单模式自动装 node + 依赖）+ 消费端冒烟。
  # ---------------------------------------------------------------------------
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux
            triplet: x64-linux
            allow_failure: false
          - os: ubuntu-24.04-arm
            preset: linux-arm64
            triplet: arm64-linux
            allow_failure: false
          - os: windows-latest
            preset: windows-clang-cl
            triplet: x64-windows-static-clang
            allow_failure: false
          - os: windows-latest
            preset: windows-clang-cl-arm64
            triplet: arm64-windows-static-clang
            allow_failure: true
          - os: macos-13
            preset: macos-x64
            triplet: x64-osx
            allow_failure: true
          - os: macos-latest
            preset: macos
            triplet: arm64-osx
            allow_failure: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure }}
    steps:
      - uses: actions/checkout@v4

      - name: 记录可用磁盘
        if: always()
        shell: bash
        run: df -h || true

      # ---- Windows：确保 clang-cl 可用 ----------------------------------------
      - name: 定位 clang-cl（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VS_LLVM=$(find "/c/Program Files/Microsoft Visual Studio" -path "*/VC/Tools/Llvm/x64/bin/clang-cl.exe" 2>/dev/null | head -1 || true)
          if [ -n "$VS_LLVM" ]; then
            LLVM_ROOT=$(dirname "$(dirname "$VS_LLVM")")
            echo "NODE_PORT_LLVM_ROOT=$LLVM_ROOT" >> "$GITHUB_ENV"
            echo "找到 VS 自带 LLVM：$LLVM_ROOT"
            exit 0
          fi
          if [ -f "/c/Program Files/LLVM/bin/clang-cl.exe" ]; then
            echo "NODE_PORT_LLVM_ROOT=/c/Program Files/LLVM" >> "$GITHUB_ENV"
            echo "找到独立 LLVM"
            exit 0
          fi
          echo "::error::找不到 clang-cl，需要安装 LLVM 或 VS 的 C++ Clang 组件"
          exit 1

      # ---- 装指定版本 vcpkg --------------------------------------------------
      - name: 安装 vcpkg ${{ env.VCPKG_REF }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -L -o vcpkg.tar.gz \
            "https://github.com/microsoft/vcpkg/archive/refs/tags/${VCPKG_REF}.tar.gz"
          mkdir -p vcpkg-src
          tar -xzf vcpkg.tar.gz -C vcpkg-src --strip-components=1
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmd.exe //c "$(cygpath -w "$RUNNER_TEMP/vcpkg-src/bootstrap-vcpkg.bat")" -disableMetrics
          else
            ./vcpkg-src/bootstrap-vcpkg.sh -disableMetrics
          fi
          ./vcpkg-src/vcpkg version
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg-src" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/vcpkg-src" >> "$GITHUB_PATH"

      # ---- L2 + L3：配置 + 构建 + 运行消费端冒烟 ------------------------------
      # 清单模式：test/vcpkg.json 声明依赖 node，vcpkg 自动装（含 overlay port）。
      # CMake preset 指定 triplet 和 toolchain，无需手敲 -D。
      - name: 配置 test（cmake preset）
        shell: bash
        run: |
          set -euo pipefail
          cd test
          cmake --preset ${{ matrix.preset }}

      - name: 构建 test
        shell: bash
        run: |
          set -euo pipefail
          cd test
          cmake --build --preset ${{ matrix.preset }}

      - name: 运行冒烟
        shell: bash
        run: |
          set -euo pipefail
          SMOKE="./test/build/${{ matrix.preset }}/app/smoke"
          [ -f "$SMOKE.exe" ] && SMOKE="$SMOKE.exe"
          OUT="$("$SMOKE" -e "process.stdout.write(process.versions.node)")"
          echo "嵌入运行时报告的 node 版本：$OUT"
          test "$OUT" = "24.21.0"

      - name: 失败时打印首错
        if: failure()
        shell: bash
        run: |
          for f in "$VCPKG_ROOT"/buildtrees/*/*-out.log; do
            [ -f "$f" ] || continue
            if grep -q -E "error:|fatal error|^FAILED|Error [0-9]+|LNK[0-9]+" "$f" 2>/dev/null; then
              echo "===== $f ====="
              grep -n -m 30 -E "error:|fatal error|^FAILED|Error [0-9]+|LNK[0-9]+" "$f" || tail -n 80 "$f"
            fi
          done

      - name: 收集日志
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          for f in "$VCPKG_ROOT"/buildtrees/*/*.log; do
            [ -f "$f" ] || continue
            port="$(basename "$(dirname "$f")")"
            cp "$f" "$RUNNER_TEMP/ci-logs/${port}_$(basename "$f")"
          done
          {
            echo "=== vcpkg version ==="
            vcpkg version 2>&1 || true
            echo "=== triplet ==="
            echo "${{ matrix.triplet }}"
            echo "=== compiler ==="
            cc --version 2>&1 || true
            c++ --version 2>&1 || true
            clang-cl --version 2>&1 || true
            echo "=== installed libs ==="
            ls -la "$VCPKG_ROOT/installed/${{ matrix.triplet }}/lib/" 2>&1 || true
            echo "=== disk space ==="
            df -h 2>&1 || true
          } > "$RUNNER_TEMP/ci-logs/env_info.txt"
          echo "收集了 $(ls -1 "$RUNNER_TEMP/ci-logs" | wc -l) 个文件"

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.triplet }}
          path: ${{ runner.temp }}/ci-logs
          if-no-files-found: error
          retention-days: 7