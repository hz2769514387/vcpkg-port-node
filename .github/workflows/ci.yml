name: CI

# The push gate: build the port through its own consumer test project on every platform cell
# the manifest claims, and run everything - this repository's own tests and Node.js's own
# suite - against the result.
#
# Each leg installs the port once and builds the consumer twice: Release, which is what is
# delivered and what the suite runs against, and RelWithDebInfo, which is the release ABI
# with debug information and therefore the configuration a consumer uses to debug their own
# code. Debug is a different install rather than a different consumer configuration - on
# Windows the debug CRT cannot link a release library - so it has its own workflow.
#
# Release-only triplets, vcpkg's own community `*-release` ones: with VCPKG_BUILD_TYPE unset
# the port builds Release *and* Debug, which is roughly twice the work per leg. The other two
# dimensions of the matrix - the dynamic CRT, and a shared library - are `matrix.yml`, and
# Debug is `debug.yml`; all three run on push as well, so a push covers every dimension, just
# not inside one job.
#
# During the development period this branch is allowed to be red; the point is that the
# signal is honest (AGENTS.md, section 5).

on:
  push:
    branches:
      - main
      # Maintained lines (docs/versioning.md): a branch that is still supported has to be
      # still built. `legacy/*` is deliberately absent - those are frozen, unmaintained, and
      # may not build at all.
      - "*_vcpkg-*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job per platform rather than a matrix: a job that calls a reusable workflow takes
  # neither a matrix nor continue-on-error (either one is accepted by the parser and then
  # produces a run with zero jobs), so the legs are spelled out and 'experimental' is passed
  # into the called workflow, which applies it to its own job. The steps still live once in
  # build-test.yml.
  #
  # Six legs: both architectures on each of the three platforms the manifest claims.
  # macOS x64 is a cross build from an arm64 image (see the x64-osx preset), which is why
  # that leg also needs the Rosetta guard and the Mach-O architecture assertion.
  windows:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: windows-2022
      preset: x64-windows-static
      triplet: x64-windows-static-release-clang
      consumer-configs: Release,RelWithDebInfo
      suite-configs: Release
      expect-arch: x64

  windows-arm64:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: windows-11-arm
      preset: arm64-windows-static
      triplet: arm64-windows-static-release-clang
      consumer-configs: Release,RelWithDebInfo
      suite-configs: Release
      expect-arch: ARM64

  linux:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: ubuntu-latest
      preset: x64-linux
      triplet: x64-linux-release
      consumer-configs: Release,RelWithDebInfo
      suite-configs: Release

  linux-arm64:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: ubuntu-24.04-arm
      preset: arm64-linux
      triplet: arm64-linux-release
      consumer-configs: Release,RelWithDebInfo
      suite-configs: Release

  macos:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: macos-latest
      preset: arm64-osx
      triplet: arm64-osx-release
      consumer-configs: Release,RelWithDebInfo
      suite-configs: Release
      expect-arch: arm64

  macos-x64:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: macos-15
      preset: x64-osx
      triplet: x64-osx-release
      consumer-configs: Release,RelWithDebInfo
      suite-configs: Release
      expect-arch: x86_64

  # One archive with every leg's logs, instead of one artifact per platform.
  logs:
    needs: [windows, windows-arm64, linux, linux-arm64, macos, macos-x64]
    if: always()
    uses: ./.github/workflows/logs.yml
    secrets: inherit
    with:
      label: ci
