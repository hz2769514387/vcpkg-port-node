name: CI

# The fast gate: build the port through its own consumer test project and run everything that
# is cheap enough to run on every push. Node.js's own suite is a separate, slower workflow
# (node-suite.yml) because a full run costs the better part of an hour.
#
# During the development period this branch is allowed to be red; the point is that the
# signal is honest (AGENTS.md, section 5).

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job per platform rather than a matrix: a job that calls a reusable workflow takes
  # neither a matrix nor continue-on-error (either one is accepted by the parser and then
  # produces a run with zero jobs), so the legs are spelled out and 'experimental' is passed
  # into the called workflow, which applies it to its own job. The steps still live once in
  # build-test.yml.
  #
  # Windows is the only platform this port has been measured on (docs/build.md), so it fails
  # the run. Linux and macOS are marked experimental: the port claims to support them and the
  # manifest lists them, but no build has ever completed there. Leaving them in makes that
  # claim visible instead of aspirational; the failure does not block a merge until it is
  # investigated.
  windows:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: windows-latest
      preset: windows
      triplet: x64-windows-static
      ctest-options: -LE node-suite

  linux:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: ubuntu-latest
      preset: linux
      triplet: x64-linux
      experimental: true
      ctest-options: -LE node-suite

  macos:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: macos-latest
      preset: macos
      triplet: arm64-osx
      experimental: true
      ctest-options: -LE node-suite
