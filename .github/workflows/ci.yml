name: CI

# The fast gate: build the port through its own consumer test project and run everything that
# is cheap enough to run on every push. Node.js's own suite is a separate, slower workflow
# (node-suite.yml) because a full run costs the better part of an hour.
#
# During the development period this branch is allowed to be red; the point is that the
# signal is honest (AGENTS.md, section 5).

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Windows is the only platform this port has been measured on (docs/build.md), so it is a
    # hard failure. Linux and macOS are marked experimental: the port claims to support them
    # and the manifest lists them, but no build has ever completed there. Leaving them in the
    # matrix makes that claim visible instead of aspirational; the failure does not block a
    # merge until it is investigated.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            preset: windows
            triplet: x64-windows-static
            experimental: false
          - runner: ubuntu-latest
            preset: linux
            triplet: x64-linux
            experimental: true
          - runner: macos-latest
            preset: macos
            triplet: arm64-osx
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      runner: ${{ matrix.runner }}
      preset: ${{ matrix.preset }}
      triplet: ${{ matrix.triplet }}
      ctest-options: -LE node-suite
