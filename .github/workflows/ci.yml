# vcpkg-port-node 的 CI。
#
# 目标：
#   1. 在 GitHub Actions runner 上用**指定的 vcpkg 版本 2026.07.29**（不是 runner 预装的那个）
#      把本仓库的 overlay port 装起来；
#   2. 再用 test/ 里的消费端工程 find_package(node) + 链接 node::node，然后跑 ctest：
#        smoke        —— 版本断言
#        unit         —— gtest：vcpkg 库自身 + 与 node 共存（版本交叉核对）
#        coexist      —— 行为级：zlib/brotli/openssl/ICU/IDN/sqlite/http/http2/worker/wasm
#                        全部由链接进来的 vcpkg 库提供；外加符号审计（Windows）
#        node-suite   —— **node 官方测试套件**，由官方 tools/test.py --shell=<本工程的可执行> 驱动
#   3. 覆盖**五个**平台：win x64/arm64、linux x64/arm64、macos arm64。
#      （x64-osx 已从 CI 移除 —— macos-13 runner 资源紧张、排队久；triplet 与本工程 preset
#        仍然保留，见 docs/暂时还没做.md。）
#
# ★ 先装 CMake 4.x 再动 vcpkg：vcpkg 2026.07.29 的脚本用了 `string(JSON ... STRING_ENCODE)`，
#   那是 CMake 4.x 才有的子命令（3.31 会报 invalid mode 'STRING_ENCODE'），而 vcpkg 执行
#   portfile.cmake 用的就是 PATH 上的 cmake。镜像里 ubuntu/macos 是 3.31 → 装依赖的第一个
#   port（zstd）就挂；Windows 恰好是 4.4 才侥幸能过。所以这里统一钉版本，不依赖镜像自带的那份。
#
# 平台口径（路线 B）：
#   * Windows：clang-cl + 静态 CRT + 静态库（x64/arm64-windows-static-clang）—— node 24+ 官方口径。
#   * Linux：gcc + 静态库（x64/arm64-linux）。
#   * macOS：clang + 静态库（arm64-osx）。
#   triplet / toolchain 都在**消费端**：test/cmake/{triplets,toolchains}/。
#   ports/node/ 只含 port 自身（portfile + vcpkg.json + patches + usage），自包含、不引用目录外文件。
#
# 策略：
#   只编译 test（清单模式自动装依赖），不做单独的 vcpkg install。
#   只出 Release（triplet 里设 VCPKG_BUILD_TYPE=release）。
#   并发度**按平台**给（矩阵里的 vcpkg_conc）：x64 给 4、macOS 压到 2
#   （3 核 / 7 GB，5 个并发 V8 编译单元容易 OOM）。这个值会经 VCPKG_CONCURRENCY
#   传给 port 内部的 ninja -j —— 给 2 会让 node 的全量构建更容易撞 job 超时。

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_REF: "2026.07.29"
  VCPKG_DISABLE_METRICS: "1"
  VCPKG_MAX_CONCURRENCY: "2"

jobs:
  # ---------------------------------------------------------------------------
  # L1：静态校验。这一层要能在**不编译**的情况下抓住所有"改 port 忘了同步"的错误，
  #     所以每条规则都落成脚本红灯，而不是文档里的"请遵守"。
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 port 清单与必备文件
        shell: bash
        run: |
          set -euo pipefail
          for f in ports/node/vcpkg.json ports/node/portfile.cmake ports/node/usage versions/n-/node.json; do
            test -f "$f" || { echo "::error::缺文件：$f"; exit 1; }
          done
          echo "必备文件齐备"

      - name: 所有 JSON 必须合法
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          files = [p for p in sorted(pathlib.Path(".").rglob("*.json")) if ".git" not in p.parts]
          bad = []
          for p in files:
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as exc:
                  bad.append((p, exc))
          for p, exc in bad:
              print("::error file=%s::JSON 不合法：%s" % (p, exc))
          print("检查了 %d 个 JSON 文件，%d 个不合法" % (len(files), len(bad)))
          sys.exit(1 if bad else 0)
          PY

      - name: 换行符统一（策略见 .gitattributes）
        shell: bash
        run: |
          set -euo pipefail
          test -f .gitattributes || { echo "::error::缺 .gitattributes"; exit 1; }
          # 逐字节判定：被跟踪文件里不该有任何 CR。.gitattributes 声明 * text=auto eol=lf，
          # 谁用 CRLF 编辑过一个文件并提交，这里就红。
          # 用 Python 读字节而不是 shell 里的 $'\r' —— 后者在不同 shell/环境里行为不一致
          # （本机 Git Bash 上会展开成空串，导致"全部文件都命中"的假阳性）。
          python3 - <<'PY'
          import pathlib
          import subprocess
          import sys

          ls = subprocess.run(["git", "ls-files", "-z"], capture_output=True, check=True).stdout
          files = [p.decode("utf-8") for p in ls.split(b"\x00") if p]
          bad = []
          for f in files:
              if f.endswith('.cmd'):
                  # 声明过的例外：Windows 批处理用 CRLF（见 .gitattributes 的 *.cmd 行）
                  continue
              try:
                  if b"\r" in pathlib.Path(f).read_bytes():
                      bad.append(f)
              except OSError as exc:
                  print("::warning file=%s::读不到文件：%s" % (f, exc))
          for f in bad:
              print("::error file=%s::含 CR，应为 LF（见 .gitattributes）" % f)
          print("检查了 %d 个被跟踪文件，%d 个含 CR" % (len(files), len(bad)))
          sys.exit(1 if bad else 0)
          PY

      - name: versions 的 git-tree 与 ports/node 实际内容一致
        shell: bash
        run: |
          set -euo pipefail
          # 两条**互相独立**的路径必须给出同一个数字，两者都过才算过：
          #  (a) 脚本按 vcpkg x-add-version 的方式算（临时索引 + write-tree + 取子树），
          #      不依赖"先提交"，本地也能用；
          #  (b) 直接读 HEAD 里 ports/node 的 tree。
          # 只留 (a) 会漏掉"脚本本身算错"这种故障（开发这个脚本时就真的漏过一次），
          # 所以 (b) 是必须的对照。
          python3 tools/version_tree.py --check
          recorded="$(python3 -c "import json;print(json.load(open('versions/n-/node.json'))['versions'][0]['git-tree'])")"
          head_tree="$(git rev-parse HEAD:ports/node)"
          echo "版本表记录：$recorded"
          echo "HEAD 里的 ：$head_tree"
          if [ "$recorded" != "$head_tree" ]; then
            echo "::error::版本表与 HEAD 里的 ports/node 不一致"
            exit 1
          fi

      - name: portfile.cmake 必须能被 CMake 解析（语法闸门）
        shell: bash
        run: |
          set -euo pipefail
          # 为什么单独立一条：portfile 里大量用 `string(APPEND _cfg "…\n")` 往生成的
          # node-config.cmake 里拼内容 —— 一个**没转义的双引号**就能把字符串提前截断。
          # 这类错误 CMake 是"先整体解析、再执行"，所以 `cmake -P` 就是一把现成的语法闸门：
          # 解析过了才会执行，而执行一定会在第一个 vcpkg_* 命令处停下（那不算错）。
          #
          # 2026-10-12 实测：给链接组写注释时就写出过一个未转义的引号，当时是 configure
          # 阶段替我挡下的 —— 那是运气不是机制（同一类话在"补丁必须挂进 PATCHES"那条里
          # 已经写过一次了，这里把它补成机制）。
          if ! command -v cmake >/dev/null 2>&1; then
            echo "::warning::本 job 没有 cmake，跳过 portfile 语法体检"
            exit 0
          fi
          bad=0
          while IFS= read -r f; do
            out="$(cmake -P "$f" 2>&1 || true)"
            if printf '%s\n' "$out" | grep -q "Parse error"; then
              echo "$out"
              echo "::error file=$f::$f 有 CMake 解析错误"
              bad=1
            fi
          done < <(find ports/node -name '*.cmake' -type f | sort)
          if [ "$bad" -ne 0 ]; then
            exit 1
          fi
          echo "ports/node 下的 cmake 文件全部可被 CMake 解析"

      - name: port 必须自包含（不引用 port 目录外的任何东西）
        shell: bash
        run: |
          set -euo pipefail
          # 1) port 目录只允许这几种条目：多出 cmake/ 之类的，就是 triplet/toolchain
          #    （属于消费端）混进 port 了。
          for p in ports/node/* ports/node/.[!.]*; do
            [ -e "$p" ] || continue
            case "$(basename "$p")" in
              portfile.cmake|vcpkg.json|usage|patches|scripts) ;;
              *) echo "::error::ports/node 出现了不该有的条目：$p"; exit 1 ;;
            esac
          done
          # 2) 脚本/清单里不能引用 port 目录外的路径。
          #    注意排除被转义的形式（\${CMAKE_CURRENT_LIST_DIR}/../.. 是**生成**给消费端
          #    的相对路径字符串，不是 port 自己去读外面的文件）。
          if grep -rnE '(^|[^\\])\$\{CMAKE_CURRENT_LIST_DIR\}/\.\./|test/cmake|ports/node/cmake' \
               --include='*.cmake' --include='*.json' ports/node; then
            echo "::error::ports/node 引用了 port 目录外的路径（见上面列出的行）"
            exit 1
          fi
          echo "port 自包含检查通过"

      - name: patches/ 里的补丁必须都挂进 portfile 的 PATCHES
        shell: bash
        run: |
          set -euo pipefail
          # 为什么单独立一条红线：2026-10-12 我把 0015 落盘后**忘了加进 PATCHES 列表**，
          # 补丁从头到尾没被应用。那一枪是 configure 阶段的红线替我挡的 —— 那是运气，
          # 不是机制。漏挂的补丁是**静默失效**：源码照旧、症状要到很后面才出现，
          # 而且外表看不出"补丁没打"和"补丁没生效"的区别。
          python3 - <<'PY'
          import pathlib, re, sys

          portfile = pathlib.Path("ports/node/portfile.cmake").read_text(encoding="utf-8")
          m = re.search(r"\bPATCHES\b(.*?)\n\)", portfile, re.S)
          if not m:
              print("::error::portfile.cmake 里找不到 PATCHES 块")
              sys.exit(1)
          block = m.group(1)
          pdir = pathlib.Path("ports/node/patches")

          bad = [p.name for p in sorted(pdir.glob("*.patch")) if p.name not in block]
          for name in bad:
              print("::error file=ports/node/patches/%s::补丁存在但没挂进 PATCHES（会静默失效）" % name)

          # 反向：PATCHES 里写的每个文件都得真的存在（防止改名后留下死引用）
          missing = [r for r in re.findall(r"patches/([0-9A-Za-z._-]+\.patch)", block)
                     if not (pdir / r).is_file()]
          for name in missing:
              print("::error::PATCHES 引用了不存在的补丁 %s" % name)

          total = len(list(pdir.glob("*.patch")))
          print("patches/ 共 %d 个；未挂载 %d 个；死引用 %d 个" % (total, len(bad), len(missing)))
          sys.exit(1 if (bad or missing) else 0)
          PY

  # ---------------------------------------------------------------------------
  # L2 + L3：编译 test（清单模式自动装 node + 依赖）+ 消费端冒烟。
  # ---------------------------------------------------------------------------
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # vcpkg_conc：这个平台的 vcpkg/ninja 并发度。x64 的 runner 是 4 核起步，
          # 给 2 会让 node 的全量构建更容易撞 job 超时；macOS 只有 3 核 / 7 GB，
          # 必须压到 2（否则 5 个并发 V8 编译单元容易 OOM）。
          - os: ubuntu-latest
            preset: linux
            triplet: x64-linux
            vcpkg_conc: 4
            allow_failure: false
          - os: ubuntu-24.04-arm
            preset: linux-arm64
            triplet: arm64-linux
            vcpkg_conc: 4
            allow_failure: true
          # expect_arch：产物的 PE Machine 断言用（见"断言产物架构"那一步）。
          - os: windows-latest
            preset: windows-clang-cl
            triplet: x64-windows-static-clang
            vcpkg_conc: 4
            allow_failure: false
            expect_arch: x64
          # ★ arm64 走 **原生 arm64 runner（windows-11-arm）**，不做 x64 宿主交叉编译。
          #   原因（run #23 / #24 实测）：交叉编译会打开 gyp 的 host toolset
          #   —— configure.py 里 `want_separate_host_toolset = int(cross_compiling)` ——
          #   而 `--with-intl=system-icu` 让 ICU 变成"只有目标架构一份"的**外部**库；
          #   gyp 的 host toolset 机制能给树内依赖编一份宿主的，但变不出宿主架构的外部 ICU。
          #   于是宿主工具（gen-regexp-special-case → 之后还有 mksnapshot）用 x64 链接器
          #   去链 ARM64 的 icu*.lib，报一堆 LNK2019 + 21 条 LNK4272。
          #   宿主==目标时这个开关是 0 ⇒ 整类问题消失（这也是上游自己对 win-arm64 的做法）。
          #   ⚠️ 该镜像带 **x64 仿真**：配置不当会"静默产出 x64 二进制"（它在 arm64 上照样跑），
          #   所以下一步的产物架构断言是必须的，不是装饰。
          - os: windows-11-arm
            preset: windows-clang-cl-arm64
            triplet: arm64-windows-static-clang
            vcpkg_conc: 4
            allow_failure: true
            expect_arch: ARM64
          - os: macos-latest
            preset: macos
            triplet: arm64-osx
            vcpkg_conc: 2
            allow_failure: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure }}
    # GitHub 单个 job 的硬上限是 6 小时。给一个留余量的值：超时被取消时，
    # `if: always()` 的收集步骤仍会跑，日志能带走 —— 否则白等一场。
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: 设定本平台的并发度
        shell: bash
        run: |
          # 覆盖 workflow 级的 VCPKG_MAX_CONCURRENCY。它会经 VCPKG_CONCURRENCY 传进
          # port 内部的 ninja -j（x64 给 4，macOS 压到 2）。
          echo "VCPKG_MAX_CONCURRENCY=${{ matrix.vcpkg_conc }}" >> "$GITHUB_ENV"
          echo "VCPKG_MAX_CONCURRENCY=${{ matrix.vcpkg_conc }}"

      - name: 记录可用磁盘
        if: always()
        shell: bash
        run: df -h || true

      # ---- 先装 CMake 4.x ------------------------------------------------------
      # vcpkg 2026.07.29 的脚本（z_vcpkg_spdx.cmake）用了 `string(JSON ... STRING_ENCODE)`，
      # 那是 CMake 4.x 才有的子命令 —— 3.31 会直接报：
      #     string sub-command JSON got an invalid mode 'STRING_ENCODE'
      # 而 vcpkg 执行 portfile.cmake 用的就是 PATH 上的 cmake，所以镜像自带哪一版就决定了成败
      # （ubuntu/macos 是 3.31 → 装依赖的第一个 port 就挂；Windows 恰好是 4.4）。
      # 这里统一钉一个版本。下载失败不直接判死：后面有一步专门断言最终 cmake 的主版本 ≥ 4，
      # 由它给出清楚的报错（而不是藏在 port 构建里）。
      - name: 安装 CMake 4.4.0（vcpkg 的脚本需要 CMake 4.x）
        shell: bash
        run: |
          set -euo pipefail
          ver="4.4.0"
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)   asset="cmake-$ver-linux-x86_64.tar.gz";    inner="cmake-$ver-linux-x86_64" ;;
            Linux-ARM64) asset="cmake-$ver-linux-aarch64.tar.gz";   inner="cmake-$ver-linux-aarch64" ;;
            macOS-*)     asset="cmake-$ver-macos-universal.tar.gz"; inner="cmake-$ver-macos-universal/CMake.app/Contents" ;;
            # arm64 Windows 有官方资产，别拿 x86_64 那份在仿真下跑（慢且徒增变量）。
            Windows-ARM64) asset="cmake-$ver-windows-arm64.zip";  inner="cmake-$ver-windows-arm64" ;;
            Windows-*)     asset="cmake-$ver-windows-x86_64.zip"; inner="cmake-$ver-windows-x86_64" ;;
            *) echo "::error::未知平台 ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
          esac
          cd "$RUNNER_TEMP"
          url="https://github.com/Kitware/CMake/releases/download/v$ver/$asset"
          echo "下载 $url"
          if ! curl -fsSL -o "$asset" "$url"; then
            echo "::warning::CMake 下载失败，退回镜像自带的 cmake（下一步会断言版本）"
            exit 0
          fi
          case "$asset" in
            *.zip) unzip -qo "$asset" ;;
            *)     tar -xzf "$asset" ;;
          esac
          bin="$RUNNER_TEMP/$inner/bin"
          if ! ls "$bin"/cmake* >/dev/null 2>&1; then
            echo "::warning::解压后没找到 cmake（$bin），退回镜像自带的那份"
            exit 0
          fi
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/cmake" --version | head -1

      # ---- Windows：确保 clang-cl 可用 ----------------------------------------
      # ★ 不能只找 `Llvm/x64`（那是 x64 宿主的布局），也不能"随便挑一个"：
      #   本机实测 VS 会**同时装 x64 与 ARM64 两套 LLVM**（`Llvm/x64`、`Llvm/ARM64`），
      #   按字典序挑会选中 ARM64，把 x64 档的编译器悄悄换掉。所以**按 runner 自己的架构挑**，
      #   找不到再放宽到任意架构兜底。
      #   NODE_PORT_LLVM_ROOT 取 `<...>/Llvm/<arch>` —— clang-cl.cmake 会在它下面
      #   先找 `x64/bin` 再找 `bin/`，两种布局都覆盖，所以 x64 档行为不变。
      - name: 定位 clang-cl（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            ARM64) llvm_arch="ARM64" ;;
            *)     llvm_arch="x64" ;;
          esac
          VS_LLVM=$(find "/c/Program Files/Microsoft Visual Studio" -path "*/VC/Tools/Llvm/${llvm_arch}/bin/clang-cl.exe" 2>/dev/null | head -1 || true)
          if [ -z "$VS_LLVM" ]; then
            # 兜底：VS 的布局万一不是 Llvm/<arch>/（比如只装了一份 LLVM）。
            VS_LLVM=$(find "/c/Program Files/Microsoft Visual Studio" -path "*/VC/Tools/Llvm/*/bin/clang-cl.exe" 2>/dev/null | head -1 || true)
          fi
          if [ -n "$VS_LLVM" ]; then
            LLVM_ROOT=$(dirname "$(dirname "$VS_LLVM")")
            echo "NODE_PORT_LLVM_ROOT=$LLVM_ROOT" >> "$GITHUB_ENV"
            echo "找到 VS 自带 LLVM：$LLVM_ROOT（clang-cl: $VS_LLVM）"
            exit 0
          fi
          if [ -f "/c/Program Files/LLVM/bin/clang-cl.exe" ]; then
            echo "NODE_PORT_LLVM_ROOT=/c/Program Files/LLVM" >> "$GITHUB_ENV"
            echo "找到独立 LLVM"
            exit 0
          fi
          # 失败时把"实际上有什么"打出来 —— 一行错误信息不该让人再花一轮 CI 去猜。
          echo "::error::找不到 clang-cl，需要安装 LLVM 或 VS 的 C++ Clang 组件"
          echo "--- 实际存在的东西 ---"
          ls -d "/c/Program Files/LLVM"* "/c/Program Files (x86)/LLVM"* 2>/dev/null || echo "(没有 LLVM 目录)"
          find "/c/Program Files/Microsoft Visual Studio" -maxdepth 5 -name "clang-cl.exe" 2>/dev/null | head -10 || true
          exit 1

      # ---- 装指定版本 vcpkg --------------------------------------------------
      - name: 安装 vcpkg ${{ env.VCPKG_REF }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -L -o vcpkg.tar.gz \
            "https://github.com/microsoft/vcpkg/archive/refs/tags/${VCPKG_REF}.tar.gz"
          mkdir -p vcpkg-src
          tar -xzf vcpkg.tar.gz -C vcpkg-src --strip-components=1
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmd.exe //c "$(cygpath -w "$RUNNER_TEMP/vcpkg-src/bootstrap-vcpkg.bat")" -disableMetrics
          else
            ./vcpkg-src/bootstrap-vcpkg.sh -disableMetrics
          fi
          ./vcpkg-src/vcpkg version
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg-src" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/vcpkg-src" >> "$GITHUB_PATH"

      # ---- 断言 CMake 主版本 ≥ 4 ----------------------------------------------
      # 这一条是给 vcpkg 立的门：低于 4 的 cmake 会让 portfile 在第一个 vcpkg_from_github /
      # vcpkg_download_distfile 上就炸（STRING_ENCODE），而且报错位置离真因很远。
      - name: 确认 CMake 主版本 ≥ 4（vcpkg 的脚本要求）
        shell: bash
        run: |
          set -euo pipefail
          which cmake
          cmake --version | head -1
          major="$(cmake --version | head -1 | sed -E 's/[^0-9]*([0-9]+)\..*/\1/')"
          if [ "${major:-0}" -lt 4 ]; then
            echo "::error::当前 cmake 主版本是 ${major}，vcpkg 2026.07.29 的脚本需要 4.x"
            exit 1
          fi

      # ---- L2 + L3：配置 + 构建 + 运行消费端冒烟 ------------------------------
      # 清单模式：test/vcpkg.json 声明依赖 node，vcpkg 自动装（含 overlay port）。
      # CMake preset 指定 triplet 和 toolchain，无需手敲 -D。
      #
      # ★ 下载重试：vcpkg 从 ftpmirror.gnu.org 等外站拉源码包时可能超时
      #   （run #21 实测 automake-1.17.tar.gz）。vcpkg 自身没有可配的重试间隔，
      #   这里在 cmake --preset 外面套一层：失败后 10s / 1m / 2m 重试共 3 次。
      #   vcpkg 会缓存已下载的文件，重试只补拉失败的那个，不会从头来。
      - name: 配置 test（cmake preset，带下载重试）
        shell: bash
        run: |
          set -uo pipefail
          cd test
          delays=(10 60 120)
          for attempt in 0 1 2 3; do
            if cmake --preset ${{ matrix.preset }}; then
              echo "配置成功（第 $((attempt+1)) 次尝试）"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::配置失败，已重试 3 次（10s/1m/2m），放弃"
              exit 1
            fi
            wait=${delays[$attempt]}
            echo "::warning::第 $((attempt+1)) 次配置失败，${wait} 秒后重试..."
            sleep "$wait"
          done

      - name: 构建 test
        shell: bash
        run: |
          # ★ tee 进文件：下面的"首错"步骤只扫 buildtrees 的日志，**看不见**这一步的
          #   输出。run #18 实测：node port 四个平台全建成功了，但 test 工程的
          #   NODE_EMBED_PATH 链接/编译失败让 job 红，而"首错"却显示
          #   "没有匹配到错误行（若本 job 成功属正常）"—— 误导。
          set -o pipefail
          cd test
          cmake --build --preset ${{ matrix.preset }} 2>&1 | tee "$RUNNER_TEMP/test-build.log"

      # ---- 断言产物架构 --------------------------------------------------------
      # 为什么需要（不是装饰）：arm64 Windows runner 带 **x64 仿真** —— 工具链配置不当
      # （target 没传下去 / 拿错 triplet）时构建会**悄悄**产出 x64 二进制，而它在 arm64 上
      # 照样能跑，于是 ctest 全绿却什么也没证明。这条直接读 PE 头，一眼定架构。
      # 用 od 而不是 dumpbin：后者要先把 VS 环境摆好，而这个断言要能在**任何**一步失败后
      # 用最少的前提跑起来。
      - name: 断言产物架构（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          exe="test/build/${{ matrix.preset }}/app/node.exe"
          want="${{ matrix.expect_arch }}"
          if [ ! -f "$exe" ]; then
            echo "::error::$exe 不存在，无法断言架构"
            exit 1
          fi
          # PE：e_lfanew（4 字节，偏移 0x3C）指向 "PE\0\0"，其后 2 字节是 Machine。
          e_lfanew=$(od -An -tu4 -j 60 -N 4 "$exe" | tr -d ' ')
          sig=$(od -An -tx1 -j "$e_lfanew" -N 4 "$exe" | tr -d ' \n')
          machine=$(od -An -tx2 -j $((e_lfanew + 4)) -N 2 "$exe" | tr -d ' ')
          if [ "$sig" != "50450000" ]; then
            echo "::error::$exe 不是 PE 文件（签名读出 $sig）"
            exit 1
          fi
          case "$machine" in
            8664) got="x64" ;;
            aa64) got="ARM64" ;;
            014c) got="x86" ;;
            01c4) got="ARM" ;;
            *)    got="0x$machine" ;;
          esac
          echo "$exe：Machine=0x$machine（$got），期望 $want"
          if [ "$got" != "$want" ]; then
            echo "::error::产物架构不对：$got != $want。arm64 runner 带 x64 仿真，x64 产物也能跑 —— 必须在这里挡住。"
            exit 1
          fi

      - name: 列出将要跑的 ctest 用例
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir "test/build/${{ matrix.preset }}" -N | tee "$RUNNER_TEMP/ctest-list.txt"

      - name: 跑 ctest（smoke + unit + coexist + node 官方套件 + 符号审计）
        shell: bash
        run: |
          # pipefail：让失败通过 tee 传出来（否则管道最后一段的退出码会把它吃掉）
          set -o pipefail
          ctest --test-dir "test/build/${{ matrix.preset }}" \
                --output-on-failure \
                -j "${VCPKG_MAX_CONCURRENCY}" \
                2>&1 | tee "$RUNNER_TEMP/ctest.log"

      - name: ctest 摘要进 job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ matrix.triplet }} ctest 摘要"
            echo ""
            echo '```'
            tail -n 80 "$RUNNER_TEMP/ctest.log" 2>/dev/null || echo "(没有 ctest.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 首错写进 job summary
        if: always()
        shell: bash
        run: |
          # run 页面上直接能看，不必下载任何东西。
          summary="$RUNNER_TEMP/first-error.txt"
          : > "$summary"
          for f in "$VCPKG_ROOT"/buildtrees/*/*-out.log; do
            [ -f "$f" ] || continue
            if grep -q -E "error:|fatal error|^FAILED|Error [0-9]+|LNK[0-9]+" "$f" 2>/dev/null; then
              {
                echo "===== $f ====="
                grep -n -m 30 -E "error:|fatal error|^FAILED|Error [0-9]+|LNK[0-9]+" "$f" || tail -n 80 "$f"
              } >> "$summary"
            fi
          done
          # ★ test 工程的构建输出也扫进来 —— 它不在 buildtrees 下，之前扫不到，
          #   于是 job 红了而"首错"却说没问题（run #18 实测）。
          if [ -f "$RUNNER_TEMP/test-build.log" ]; then
            if grep -q -E "error:|fatal error|^FAILED|Error [0-9]+|LNK[0-9]+" "$RUNNER_TEMP/test-build.log" 2>/dev/null; then
              {
                echo "===== test-build.log ====="
                grep -n -m 30 -E "error:|fatal error|^FAILED|Error [0-9]+|LNK[0-9]+" "$RUNNER_TEMP/test-build.log" || tail -n 80 "$RUNNER_TEMP/test-build.log"
              } >> "$summary"
            fi
          fi
          if [ -s "$summary" ]; then
            cat "$summary"
            {
              echo "## ${{ matrix.triplet }} 首错"
              echo '```'
              head -n 120 "$summary"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "没有匹配到错误行（若本 job 成功属正常）"
          fi

      - name: 收集日志
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          for f in "$RUNNER_TEMP/test-build.log" "$RUNNER_TEMP/ctest.log" "$RUNNER_TEMP/ctest-list.txt"; do
            [ -f "$f" ] && cp "$f" "$RUNNER_TEMP/ci-logs/" || true
          done
          for f in "$VCPKG_ROOT"/buildtrees/*/*.log; do
            [ -f "$f" ] || continue
            port="$(basename "$(dirname "$f")")"
            cp "$f" "$RUNNER_TEMP/ci-logs/${port}_$(basename "$f")"
          done
          {
            echo "=== vcpkg version ==="
            vcpkg version 2>&1 || true
            echo "=== triplet ==="
            echo "${{ matrix.triplet }}"
            echo "=== preset ==="
            echo "${{ matrix.preset }}"
            echo "=== compiler ==="
            cc --version 2>&1 || true
            c++ --version 2>&1 || true
            clang-cl --version 2>&1 || true
            echo "=== installed libs ==="
            ls -la "$VCPKG_ROOT/installed/${{ matrix.triplet }}/lib/" 2>&1 || true
            echo "=== installed node-config ==="
            sed -n '1,80p' "$VCPKG_ROOT/installed/${{ matrix.triplet }}/share/node/node-config.cmake" 2>&1 || true
            echo "=== disk space ==="
            df -h 2>&1 || true
          } > "$RUNNER_TEMP/ci-logs/env_info.txt"
          # ctest 的输出与用例清单也一起进归档（它们是"结论"，比 buildtrees 更常被翻）
          for f in ctest.log ctest-list.txt; do
            [ -f "$RUNNER_TEMP/$f" ] && cp "$RUNNER_TEMP/$f" "$RUNNER_TEMP/ci-logs/$f"
          done
          echo "收集了 $(ls -1 "$RUNNER_TEMP/ci-logs" | wc -l) 个文件"

      - name: 上传本 job 的日志（中间产物）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-part-${{ matrix.triplet }}
          path: ${{ runner.temp }}/ci-logs
          if-no-files-found: error
          retention-days: 2

  # ---------------------------------------------------------------------------
  # 汇总日志：把各平台的日志合成**一个**归档 —— 下载一次就够。
  # ---------------------------------------------------------------------------
  logs:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: logs-part-*
          path: all-logs
          merge-multiple: false

      - name: 合成单个归档
        shell: bash
        run: |
          set -euo pipefail
          # head 会提前关管道 → 上游 tar/ls 收到 SIGPIPE 而非零退出；配合 pipefail 会让这一步
          # 整步失败（run #14 就是这么把 logs job 弄红的）。这里统一给 `|| true`。
          ls -R all-logs | head -n 60 || true
          tar -czf ci-logs.tar.gz -C all-logs .
          ls -lh ci-logs.tar.gz
          {
            echo "## 日志归档"
            echo ""
            echo "下载 ci-logs artifact 即可拿到**全部平台**的日志（一个文件，目录名区分平台）。"
            echo ""
            echo '```'
            tar -tzf ci-logs.tar.gz | head -n 60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传汇总归档
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-logs.tar.gz
          if-no-files-found: error
          retention-days: 7
