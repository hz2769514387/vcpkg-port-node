name: ci lint

# 静态校验（四条红线 + 两把语法闸门）。与构建口径无关，所以两边都跑：
# 它在 push（= debug 那一轮）与手工触发（= release 那一轮）都会执行，且不需要平台矩阵。
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 port 清单与必备文件
        shell: bash
        run: |
          set -euo pipefail
          for f in ports/node/vcpkg.json ports/node/portfile.cmake ports/node/usage versions/n-/node.json; do
            test -f "$f" || { echo "::error::缺文件：$f"; exit 1; }
          done
          echo "必备文件齐备"

      - name: 所有 JSON 必须合法
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          files = [p for p in sorted(pathlib.Path(".").rglob("*.json")) if ".git" not in p.parts]
          bad = []
          for p in files:
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as exc:
                  bad.append((p, exc))
          for p, exc in bad:
              print("::error file=%s::JSON 不合法：%s" % (p, exc))
          print("检查了 %d 个 JSON 文件，%d 个不合法" % (len(files), len(bad)))
          sys.exit(1 if bad else 0)
          PY

      - name: 换行符统一（策略见 .gitattributes）
        shell: bash
        run: |
          set -euo pipefail
          test -f .gitattributes || { echo "::error::缺 .gitattributes"; exit 1; }
          # 逐字节判定：被跟踪文件里不该有任何 CR。.gitattributes 声明 * text=auto eol=lf，
          # 谁用 CRLF 编辑过一个文件并提交，这里就红。
          # 用 Python 读字节而不是 shell 里的 $'\r' —— 后者在不同 shell/环境里行为不一致
          # （本机 Git Bash 上会展开成空串，导致"全部文件都命中"的假阳性）。
          python3 - <<'PY'
          import pathlib
          import subprocess
          import sys

          ls = subprocess.run(["git", "ls-files", "-z"], capture_output=True, check=True).stdout
          files = [p.decode("utf-8") for p in ls.split(b"\x00") if p]
          bad = []
          for f in files:
              if f.endswith('.cmd'):
                  # 声明过的例外：Windows 批处理用 CRLF（见 .gitattributes 的 *.cmd 行）
                  continue
              try:
                  if b"\r" in pathlib.Path(f).read_bytes():
                      bad.append(f)
              except OSError as exc:
                  print("::warning file=%s::读不到文件：%s" % (f, exc))
          for f in bad:
              print("::error file=%s::含 CR，应为 LF（见 .gitattributes）" % f)
          print("检查了 %d 个被跟踪文件，%d 个含 CR" % (len(files), len(bad)))
          sys.exit(1 if bad else 0)
          PY

      - name: versions 的 git-tree 与 ports/node 实际内容一致
        shell: bash
        run: |
          set -euo pipefail
          # 两条**互相独立**的路径必须给出同一个数字，两者都过才算过：
          #  (a) 脚本按 vcpkg x-add-version 的方式算（临时索引 + write-tree + 取子树），
          #      不依赖"先提交"，本地也能用；
          #  (b) 直接读 HEAD 里 ports/node 的 tree。
          # 只留 (a) 会漏掉"脚本本身算错"这种故障（开发这个脚本时就真的漏过一次），
          # 所以 (b) 是必须的对照。
          python3 tools/version_tree.py --check
          recorded="$(python3 -c "import json;print(json.load(open('versions/n-/node.json'))['versions'][0]['git-tree'])")"
          head_tree="$(git rev-parse HEAD:ports/node)"
          echo "版本表记录：$recorded"
          echo "HEAD 里的 ：$head_tree"
          if [ "$recorded" != "$head_tree" ]; then
            echo "::error::版本表与 HEAD 里的 ports/node 不一致"
            exit 1
          fi

      - name: portfile.cmake 必须能被 CMake 解析（语法闸门）
        shell: bash
        run: |
          set -euo pipefail
          # 为什么单独立一条：portfile 里大量用 `string(APPEND _cfg "…\n")` 往生成的
          # node-config.cmake 里拼内容 —— 一个**没转义的双引号**就能把字符串提前截断。
          # 这类错误 CMake 是"先整体解析、再执行"，所以 `cmake -P` 就是一把现成的语法闸门：
          # 解析过了才会执行，而执行一定会在第一个 vcpkg_* 命令处停下（那不算错）。
          #
          # 2026-10-12 实测：给链接组写注释时就写出过一个未转义的引号，当时是 configure
          # 阶段替我挡下的 —— 那是运气不是机制（同一类话在"补丁必须挂进 PATCHES"那条里
          # 已经写过一次了，这里把它补成机制）。
          if ! command -v cmake >/dev/null 2>&1; then
            echo "::warning::本 job 没有 cmake，跳过 portfile 语法体检"
            exit 0
          fi
          bad=0
          while IFS= read -r f; do
            out="$(cmake -P "$f" 2>&1 || true)"
            if printf '%s\n' "$out" | grep -q "Parse error"; then
              echo "$out"
              echo "::error file=$f::$f 有 CMake 解析错误"
              bad=1
            fi
          done < <(find ports/node -name '*.cmake' -type f | sort)
          if [ "$bad" -ne 0 ]; then
            exit 1
          fi
          echo "ports/node 下的 cmake 文件全部可被 CMake 解析"

          # ★ 上一条挡不住的盲区（2026-10-13 实测付出 2h37m 的代价）：
          #   `cmake -P` 只在**执行到某一行**时才报"引号内变量引用没闭合"，
          #   而 portfile 执行到第一个 `vcpkg_*` 命令就停下了（那是预期的）——
          #   于是 `"${_cfg"`（少一个 `}`）这种错它**永远报不出来**。
          #   这里补一个纯文本检查器（带自测），专治这一类。
          echo "=== 引号内变量引用是否闭合 ==="
          python3 tools/check_cmake_strings.py --self-test
          python3 tools/check_cmake_strings.py ports/node

      - name: test 工程的胶水必须能完整加载（反"早退遮蔽"闸门）
        shell: bash
        run: |
          set -u
          # 为什么单独立一条：test/tests/*.cmake 开头是一串 `if(NOT …) return()`，
          # 而 `cmake -P <file>`（上一条闸门）在脚本模式下**必然**停在这些早退处
          # ⇒ 早退之后的语法/流控错误它永远看不到。
          # 2026-10-13 实测代价：一行多余的 `if()` 让 Windows 的配置期报
          #   CMake Error at tests/ctest_node_suite.cmake:113 (if):
          #     Flow control statements are not properly nested.
          # 于是那一轮 6 个 job 全废。本步骤造 fixture 满足全部早退条件 + 顶掉
          # add_test/set_tests_properties，把胶水真加载到末尾，并断言注册到了用例。
          if ! command -v cmake >/dev/null 2>&1; then
            echo "::warning::本 job 没有 cmake，跳过胶水加载闸门"
            exit 0
          fi
          cmake -P tools/check_test_glue.cmake

      - name: port 必须自包含（不引用 port 目录外的任何东西）
        shell: bash
        run: |
          set -euo pipefail
          # 1) port 目录只允许这几种条目：多出 cmake/ 之类的，就是 triplet/toolchain
          #    （属于消费端）混进 port 了。
          for p in ports/node/* ports/node/.[!.]*; do
            [ -e "$p" ] || continue
            case "$(basename "$p")" in
              portfile.cmake|vcpkg.json|usage|patches|scripts) ;;
              *) echo "::error::ports/node 出现了不该有的条目：$p"; exit 1 ;;
            esac
          done
          # 2) 脚本/清单里不能引用 port 目录外的路径。
          #    注意排除被转义的形式（\${CMAKE_CURRENT_LIST_DIR}/../.. 是**生成**给消费端
          #    的相对路径字符串，不是 port 自己去读外面的文件）。
          if grep -rnE '(^|[^\\])\$\{CMAKE_CURRENT_LIST_DIR\}/\.\./|test/cmake|ports/node/cmake' \
               --include='*.cmake' --include='*.json' ports/node; then
            echo "::error::ports/node 引用了 port 目录外的路径（见上面列出的行）"
            exit 1
          fi
          echo "port 自包含检查通过"

      - name: patches/ 里的补丁必须都挂进 portfile 的 PATCHES
        shell: bash
        run: |
          set -euo pipefail
          # 为什么单独立一条红线：2026-10-12 我把 0015 落盘后**忘了加进 PATCHES 列表**，
          # 补丁从头到尾没被应用。那一枪是 configure 阶段的红线替我挡的 —— 那是运气，
          # 不是机制。漏挂的补丁是**静默失效**：源码照旧、症状要到很后面才出现，
          # 而且外表看不出"补丁没打"和"补丁没生效"的区别。
          python3 - <<'PY'
          import pathlib, re, sys

          portfile = pathlib.Path("ports/node/portfile.cmake").read_text(encoding="utf-8")
          m = re.search(r"\bPATCHES\b(.*?)\n\)", portfile, re.S)
          if not m:
              print("::error::portfile.cmake 里找不到 PATCHES 块")
              sys.exit(1)
          block = m.group(1)
          pdir = pathlib.Path("ports/node/patches")

          bad = [p.name for p in sorted(pdir.glob("*.patch")) if p.name not in block]
          for name in bad:
              print("::error file=ports/node/patches/%s::补丁存在但没挂进 PATCHES（会静默失效）" % name)

          # 反向：PATCHES 里写的每个文件都得真的存在（防止改名后留下死引用）
          missing = [r for r in re.findall(r"patches/([0-9A-Za-z._-]+\.patch)", block)
                     if not (pdir / r).is_file()]
          for name in missing:
              print("::error::PATCHES 引用了不存在的补丁 %s" % name)

          total = len(list(pdir.glob("*.patch")))
          print("patches/ 共 %d 个；未挂载 %d 个；死引用 %d 个" % (total, len(bad), len(missing)))
          sys.exit(1 if (bad or missing) else 0)
          PY

  # ---------------------------------------------------------------------------
  # L2 + L3：编译 test（清单模式自动装 node + 依赖）+ 消费端冒烟。
  # ---------------------------------------------------------------------------
