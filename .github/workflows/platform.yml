# vcpkg-port-node 的 CI。
#
# 目标：
#   1. 在 GitHub Actions runner 上用**指定的 vcpkg 版本 2026.07.29**（不是 runner 预装的那个）
#      把本仓库的 overlay port 装起来；
#   2. 再用 test/ 里的消费端工程 find_package(node) + 链接 node::node，然后跑 ctest：
#        smoke        —— 版本断言
#        unit         —— gtest：vcpkg 库自身 + 与 node 共存（版本交叉核对）
#        coexist      —— 行为级：zlib/brotli/openssl/ICU/IDN/sqlite/http/http2/worker/wasm
#                        全部由链接进来的 vcpkg 库提供；外加符号审计（Windows）
#        node-suite   —— **node 官方测试套件**，由官方 tools/test.py --shell=<本工程的可执行> 驱动
#   3. 覆盖**五个**平台：win x64/arm64、linux x64/arm64、macos arm64。
#      （x64-osx 已从 CI 移除 —— macos-13 runner 资源紧张、排队久；triplet 与本工程 preset
#        仍然保留，见 docs/暂时还没做.md。）
#
# ★ 先装 CMake 4.x 再动 vcpkg：vcpkg 2026.07.29 的脚本用了 `string(JSON ... STRING_ENCODE)`，
#   那是 CMake 4.x 才有的子命令（3.31 会报 invalid mode 'STRING_ENCODE'），而 vcpkg 执行
#   portfile.cmake 用的就是 PATH 上的 cmake。镜像里 ubuntu/macos 是 3.31 → 装依赖的第一个
#   port（zstd）就挂；Windows 恰好是 4.4 才侥幸能过。所以这里统一钉版本，不依赖镜像自带的那份。
#
# 平台口径（2026-10-14 重构后）：
#   * 六腿全部用 **vcpkg 自带标准 triplet**（消费端不写任何 triplet/toolchain）：
#     ci-debug 用双份变体（不设 VCPKG_BUILD_TYPE ⇒ port 编 Release+Debug 两份、
#     debug 库进 debug/lib/，消费方 Debug 链 debug 库）；ci-release 用 *-release
#     变体（VCPKG_BUILD_TYPE=release ⇒ 只编 Release，省一半构建时间）。
#   * Windows：node 由 clang-cl 编（node 24+ 官方口径）—— 编译器与 MSVC 命令行环境
#     由 port 自己准备（ports/node/scripts/node-msvc-env.cmake +
#     vcpkg_find_acquire_program(CLANG)）；依赖与消费端代码由标准 triplet 决定。
#   * Linux：gcc；macOS：clang（x64-osx 经 Rosetta 跑 x86_64 产物）。
#   * ports/node/ 只含 port 自身（portfile + vcpkg.json + patches + scripts + usage），
#     自包含、不引用目录外文件。
#
# 策略：
#   只编译 test（清单模式自动装依赖），不做单独的 vcpkg install。
#   并发度**按平台**给（矩阵里的 vcpkg_conc）：x64 给 4、macOS 压到 2
#   （3 核 / 7 GB，5 个并发 V8 编译单元容易 OOM）。这个值会经 VCPKG_CONCURRENCY
#   传给 port 内部的 ninja -j —— 给 2 会让 node 的全量构建更容易撞 job 超时。

name: platform

# 共享的"单平台 构建 + ctest"作业。ci-debug.yml / ci-release.yml 用 workflow_call 调用它。
#
# 为什么拆：debug 与 release 是两套**触发策略**（push 默认跑 debug；release 手工触发），
# 但作业体完全一样 —— 复制几百行只会在下次改动时漂移。平台差异全部走 inputs：
#   os / preset / triplet / label / vcpkg_conc / allow_failure / expect_arch / debug
#
# debug="" 表示 release 口径；debug="1" 时配置时额外传 -DCMAKE_BUILD_TYPE=Debug
#   （消费端测试工程按 debug 编、链 port 的 debug 库）。port 编哪几份由 triplet 的
#   VCPKG_BUILD_TYPE 决定（重构后没有私有开关 NODE_PORT_BUILD_TYPE 了）。
on:
  workflow_call:
    inputs:
      os:            { required: true,  type: string }
      preset:        { required: true,  type: string }
      triplet:       { required: true,  type: string }
      label:         { required: true,  type: string }
      vcpkg_conc:    { required: true,  type: string }
      allow_failure: { required: true,  type: string }
      expect_arch:   { required: false, type: string, default: "" }
      debug:         { required: false, type: string, default: "" }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.label }}
  cancel-in-progress: true

env:
  VCPKG_REF: "2026.07.29"
  VCPKG_DISABLE_METRICS: "1"
  VCPKG_MAX_CONCURRENCY: "2"

jobs:
  build:
    name: ${{ inputs.label }}
    # ★ 必须是**布尔**：`continue-on-error` 不接受字符串。2026-10-14 实测：调用方矩阵里给的是
    #   `allow_failure: "true"`（带引号 ⇒ 字符串），直接写成 `${{ inputs.allow_failure }}` 会被
    #   GH 判 `Unexpected value 'true'`，六个腿全在 0 秒处报错。所以这里显式比一次得到布尔。
    continue-on-error: ${{ inputs.allow_failure == 'true' }}
    runs-on: ${{ inputs.os }}
    # GitHub 单个 job 的硬上限是 6 小时。给一个留余量的值：超时被取消时，
    # `if: always()` 的收集步骤仍会跑，日志能带走 —— 否则白等一场。
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: 设定本平台的并发度
        shell: bash
        run: |
          # 覆盖 workflow 级的 VCPKG_MAX_CONCURRENCY。它会经 VCPKG_CONCURRENCY 传进
          # port 内部的 ninja -j（x64 给 4，macOS 压到 2）。
          echo "VCPKG_MAX_CONCURRENCY=${{ inputs.vcpkg_conc }}" >> "$GITHUB_ENV"
          echo "VCPKG_MAX_CONCURRENCY=${{ inputs.vcpkg_conc }}"

      - name: 记录可用磁盘
        if: always()
        shell: bash
        run: df -h || true

      # ---- 先装 CMake 4.x ------------------------------------------------------
      # vcpkg 2026.07.29 的脚本（z_vcpkg_spdx.cmake）用了 `string(JSON ... STRING_ENCODE)`，
      # 那是 CMake 4.x 才有的子命令 —— 3.31 会直接报：
      #     string sub-command JSON got an invalid mode 'STRING_ENCODE'
      # 而 vcpkg 执行 portfile.cmake 用的就是 PATH 上的 cmake，所以镜像自带哪一版就决定了成败
      # （ubuntu/macos 是 3.31 → 装依赖的第一个 port 就挂；Windows 恰好是 4.4）。
      # 这里统一钉一个版本。下载失败不直接判死：后面有一步专门断言最终 cmake 的主版本 ≥ 4，
      # 由它给出清楚的报错（而不是藏在 port 构建里）。
      - name: 安装 CMake 4.4.0（vcpkg 的脚本需要 CMake 4.x）
        shell: bash
        run: |
          set -euo pipefail
          ver="4.4.0"
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)   asset="cmake-$ver-linux-x86_64.tar.gz";    inner="cmake-$ver-linux-x86_64" ;;
            Linux-ARM64) asset="cmake-$ver-linux-aarch64.tar.gz";   inner="cmake-$ver-linux-aarch64" ;;
            macOS-*)     asset="cmake-$ver-macos-universal.tar.gz"; inner="cmake-$ver-macos-universal/CMake.app/Contents" ;;
            # arm64 Windows 有官方资产，别拿 x86_64 那份在仿真下跑（慢且徒增变量）。
            Windows-ARM64) asset="cmake-$ver-windows-arm64.zip";  inner="cmake-$ver-windows-arm64" ;;
            Windows-*)     asset="cmake-$ver-windows-x86_64.zip"; inner="cmake-$ver-windows-x86_64" ;;
            *) echo "::error::未知平台 ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
          esac
          cd "$RUNNER_TEMP"
          url="https://github.com/Kitware/CMake/releases/download/v$ver/$asset"
          echo "下载 $url"
          if ! curl -fsSL -o "$asset" "$url"; then
            echo "::warning::CMake 下载失败，退回镜像自带的 cmake（下一步会断言版本）"
            exit 0
          fi
          case "$asset" in
            *.zip) unzip -qo "$asset" ;;
            *)     tar -xzf "$asset" ;;
          esac
          bin="$RUNNER_TEMP/$inner/bin"
          if ! ls "$bin"/cmake* >/dev/null 2>&1; then
            echo "::warning::解压后没找到 cmake（$bin），退回镜像自带的那份"
            exit 0
          fi
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/cmake" --version | head -1

      # ---- x64-osx 交叉编译的 Rosetta 守卫 ------------------------------------
      # macos-15 是 arm64 镜像，而 x64-osx triplet 要的是 x86_64 产物。portfile 用
      # node 自己的机制（--dest-cpu=x64 --no-cross-compiling，见 portfile 0.5 段）
      # 把整棵构建——**包括构建工具**（mksnapshot/torque/js2c/gen-regexp-special-case）
      # 和 ctest 要跑的可执行——都编成 x86_64；这些二进制在 arm64 宿主上靠
      # Rosetta 2 运行。GitHub 的 arm64 镜像不保证预装 Rosetta（社区反馈需要
      # softwareupdate 手动装），所以这里先探测、缺了就装：
      # 否则失败点会是离真因极远的 "Bad CPU type in executable"/"exec format error"。
      - name: 确保 Rosetta 2 可用（仅 x64-osx）
        if: runner.os == 'macOS' && inputs.triplet == 'x64-osx'
        shell: bash
        run: |
          set -euo pipefail
          if /usr/bin/arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            echo "Rosetta 2 已可用（x86_64 二进制可执行）"
            exit 0
          fi
          echo "Rosetta 2 不可用，安装中……"
          sudo softwareupdate --install-rosetta --agree-to-license
          /usr/bin/arch -x86_64 /usr/bin/true
          echo "Rosetta 2 安装完成"

      # ---- Windows：给 port 的 clang-cl 发现一个明确覆盖 -------------------------
      # ★ 不能只找 `Llvm/x64`（那是 x64 宿主的布局），也不能"随便挑一个"：
      #   本机实测 VS 会**同时装 x64 与 ARM64 两套 LLVM**（`Llvm/x64`、`Llvm/ARM64`），
      #   按字典序挑会选中 ARM64，把 x64 档的编译器悄悄换掉（在 x64 宿主上执行 ARM64
      #   二进制直接 WinError 216，报错点还在 configure.py 的宏探测里、离真因极远）。
      #   所以**按 runner 自己的架构挑**，找不到再放宽到任意架构兜底。
      #   NODE_PORT_LLVM_ROOT 取 `<...>/Llvm/<arch>` —— portfile 会在它下面先找
      #   `x64/bin` 再找 `bin/`，两种布局都覆盖。
      # ★ 2026-10-14 重构后这只是**覆盖项**：port 自己会经 vcpkg_find_acquire_program(CLANG)
      #   找 clang-cl。保留这步是为了①在装依赖之前就明确失败（省一轮 3 小时）、
      #   ②钉住 runner 上"两套 LLVM 按架构挑"这个坑。
      - name: 定位 clang-cl（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            ARM64) llvm_arch="ARM64" ;;
            *)     llvm_arch="x64" ;;
          esac
          VS_LLVM=$(find "/c/Program Files/Microsoft Visual Studio" -path "*/VC/Tools/Llvm/${llvm_arch}/bin/clang-cl.exe" 2>/dev/null | head -1 || true)
          if [ -z "$VS_LLVM" ]; then
            # 兜底：VS 的布局万一不是 Llvm/<arch>/（比如只装了一份 LLVM）。
            VS_LLVM=$(find "/c/Program Files/Microsoft Visual Studio" -path "*/VC/Tools/Llvm/*/bin/clang-cl.exe" 2>/dev/null | head -1 || true)
          fi
          if [ -n "$VS_LLVM" ]; then
            LLVM_ROOT=$(dirname "$(dirname "$VS_LLVM")")
            echo "NODE_PORT_LLVM_ROOT=$LLVM_ROOT" >> "$GITHUB_ENV"
            echo "找到 VS 自带 LLVM：$LLVM_ROOT（clang-cl: $VS_LLVM）"
            exit 0
          fi
          if [ -f "/c/Program Files/LLVM/bin/clang-cl.exe" ]; then
            echo "NODE_PORT_LLVM_ROOT=/c/Program Files/LLVM" >> "$GITHUB_ENV"
            echo "找到独立 LLVM"
            exit 0
          fi
          # 失败时把"实际上有什么"打出来 —— 一行错误信息不该让人再花一轮 CI 去猜。
          echo "::error::找不到 clang-cl，需要安装 LLVM 或 VS 的 C++ Clang 组件"
          echo "--- 实际存在的东西 ---"
          ls -d "/c/Program Files/LLVM"* "/c/Program Files (x86)/LLVM"* 2>/dev/null || echo "(没有 LLVM 目录)"
          find "/c/Program Files/Microsoft Visual Studio" -maxdepth 5 -name "clang-cl.exe" 2>/dev/null | head -10 || true
          exit 1

      # ---- 装指定版本 vcpkg --------------------------------------------------
      - name: 安装 vcpkg ${{ env.VCPKG_REF }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -L -o vcpkg.tar.gz \
            "https://github.com/microsoft/vcpkg/archive/refs/tags/${VCPKG_REF}.tar.gz"
          mkdir -p vcpkg-src
          tar -xzf vcpkg.tar.gz -C vcpkg-src --strip-components=1
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmd.exe //c "$(cygpath -w "$RUNNER_TEMP/vcpkg-src/bootstrap-vcpkg.bat")" -disableMetrics
          else
            ./vcpkg-src/bootstrap-vcpkg.sh -disableMetrics
          fi
          ./vcpkg-src/vcpkg version
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg-src" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/vcpkg-src" >> "$GITHUB_PATH"

      # ---- 断言 CMake 主版本 ≥ 4 ----------------------------------------------
      # 这一条是给 vcpkg 立的门：低于 4 的 cmake 会让 portfile 在第一个 vcpkg_from_github /
      # vcpkg_download_distfile 上就炸（STRING_ENCODE），而且报错位置离真因很远。
      - name: 确认 CMake 主版本 ≥ 4（vcpkg 的脚本要求）
        shell: bash
        run: |
          set -euo pipefail
          which cmake
          cmake --version | head -1
          major="$(cmake --version | head -1 | sed -E 's/[^0-9]*([0-9]+)\..*/\1/')"
          if [ "${major:-0}" -lt 4 ]; then
            echo "::error::当前 cmake 主版本是 ${major}，vcpkg 2026.07.29 的脚本需要 4.x"
            exit 1
          fi

      # ---- Windows：给**消费端**的 cmake 一个 MSVC 命令行环境 --------------------
      # vcpkg 自己会给 port 构建摆好 MSVC 环境（所以装依赖这一步从来不需要它），但
      # **消费端工程**的 cmake 是跑在裸 shell 里的：没有 cl.exe / rc.exe / LIB / INCLUDE，
      # 编译器探测直接挂在一个离真因很远的地方（2026-10-15 实测）：
      #     RC Pass 1: command "rc /fo ... manifest.res ... manifest.rc" failed
      #     no such file or directory
      # 这不是本 port 的要求 —— Windows 上**任何** CMake 工程都一样：要么在 VS 开发者
      # 命令行里跑，要么自己摆环境。CI 的 bash 两者都不是，所以这里定位 vcvarsall，
      # 再把下面几步的 cmake 调用包一层（见 runw()）。
      - name: 定位 MSVC 命令行环境（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          vs="$("$vswhere" -latest -products '*' \
                -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 \
                -property installationPath | tr -d '\r' | tail -1)"
          if [ -z "$vs" ] || [ ! -f "$vs/VC/Auxiliary/Build/vcvarsall.bat" ]; then
            echo "::error::找不到 vcvarsall.bat（vswhere 给出：'$vs'）"
            ls -d "/c/Program Files/Microsoft Visual Studio"/*/* 2>/dev/null || true
            exit 1
          fi
          # arm64 那一档是**交叉编译**：宿主 x64、目标 arm64 ⇒ vcvarsall 的 x64_arm64。
          # （port 内部编 node 用的是 clang-cl --target=aarch64，不吃这个参数。）
          case "${{ inputs.triplet }}" in
            arm64*) msvc_arch="x64_arm64" ;;
            *)      msvc_arch="x64" ;;
          esac
          echo "VCVARSALL=$vs/VC/Auxiliary/Build/vcvarsall.bat" >> "$GITHUB_ENV"
          echo "MSVC_ARCH=$msvc_arch" >> "$GITHUB_ENV"
          echo "vcvarsall: $vs/VC/Auxiliary/Build/vcvarsall.bat  arch: $msvc_arch"

      # ---- L2 + L3：配置 + 构建 + 运行消费端冒烟 ------------------------------
      # 清单模式：test/vcpkg.json 声明依赖 node，vcpkg 自动装（含 overlay port）。
      # CMake preset 指定 triplet 和 toolchain，无需手敲 -D。
      #
      # ★ 下载重试：vcpkg 从 ftpmirror.gnu.org 等外站拉源码包时可能超时
      #   （run #21 实测 automake-1.17.tar.gz）。vcpkg 自身没有可配的重试间隔，
      #   这里在 cmake --preset 外面套一层：失败后 10s / 1m / 2m 重试共 3 次。
      #   vcpkg 会缓存已下载的文件，重试只补拉失败的那个，不会从头来。
      #
      # ★★ 但**只对下载/网络类失败重试**（2026-10-13 加）。
      #   为什么：一次"配置 test"会把整棵 node 重编一遍（x64-windows 实测 **32 分钟**）。
      #   对**确定性**失败重试 = 把故障时间乘 4。实测代价：portfile 里一个笔误
      #   （`"${_cfg"` 少一个 `}`）被重试了 4 次，白烧 **2 小时 37 分钟**，
      #   而真因一行就能看出来。所以：不像下载问题的，立刻失败，把时间留给下一次修复。
      - name: 配置 test（cmake preset，只对下载类失败重试）
        shell: bash
        run: |
          set -uo pipefail
          cd test
          log="$RUNNER_TEMP/configure.log"
          # debug Windows 的 node 官方套件并行度再压一档：preset 里 windows 两档写死
          # NODE_PORT_TEST_JOBS=2（run #32 的提交量缓解），但 debug 版 V8 的堆明显更大，
          # run #41 实测 -j 2 仍偶发 0xC0000409（提交量耗尽，见 ctest_node_suite.cmake
          # L114-127 的诊断）。release V8 堆小，保持 -j 2 不变。
          extra_cfg=""
          if [ "${{ inputs.debug }}" = "1" ]; then
            case "${{ inputs.os }}" in
              windows*) extra_cfg="-DNODE_PORT_TEST_JOBS=1" ;;
            esac
          fi
          # ★ triplet 以矩阵为准（-D 覆盖 preset 的默认值）：ci-debug 传双份 triplet、
          #   ci-release 传 *-release。preset 里的默认值只是本机开发的默认。
          extra_cfg="-DVCPKG_TARGET_TRIPLET=${{ inputs.triplet }} $extra_cfg"
          # ★ Windows 上要把 cmake 放进 vcvars 摆好的环境里跑（理由见上一步）。
          #   非 Windows 什么都不加，保持原来的调用形态。
          runw() {
            if [ "${RUNNER_OS}" = "Windows" ]; then
              cmd //c "call \"${VCVARSALL}\" ${MSVC_ARCH} && $*"
            else
              eval "$*"
            fi
          }
          delays=(10 60 120)
          for attempt in 0 1 2 3; do
            if runw "cmake --preset ${{ inputs.preset }}${{ inputs.debug == '1' && ' -DCMAKE_BUILD_TYPE=Debug' || '' }} $extra_cfg" 2>&1 | tee "$log"; then
              echo "配置成功（第 $((attempt+1)) 次尝试）"
              exit 0
            fi
            if ! grep -qE "Failed to download|Could not resolve|Timeout was reached|curl:|Failed to connect|connection (timed out|reset)|502 Bad Gateway|503 Service|vcpkg_download_distfile" "$log"; then
              echo "::error::配置失败，且输出里看不到下载/网络类特征 —— 不再重试（重试要重编整棵 node，约半小时起）"
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::配置失败（疑似下载问题），已重试 3 次（10s/1m/2m），放弃"
              exit 1
            fi
            wait=${delays[$attempt]}
            echo "::warning::第 $((attempt+1)) 次配置失败，疑似下载问题，${wait} 秒后重试..."
            sleep "$wait"
          done

      - name: 构建 test
        shell: bash
        run: |
          # ★ tee 进文件：下面的"首错"步骤只扫 buildtrees 的日志，**看不见**这一步的
          #   输出。run #18 实测：node port 四个平台全建成功了，但 test 工程的
          #   NODE_EMBED_PATH 链接/编译失败让 job 红，而"首错"却显示
          #   "没有匹配到错误行（若本 job 成功属正常）"—— 误导。
          set -o pipefail
          cd test
          # 同上：Windows 上要在 MSVC 命令行环境里跑（cl.exe / rc.exe / LIB）。
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cmd //c "call \"${VCVARSALL}\" ${MSVC_ARCH} && cmake --build --preset ${{ inputs.preset }}" \
              2>&1 | tee "$RUNNER_TEMP/test-build.log"
          else
            cmake --build --preset ${{ inputs.preset }} 2>&1 | tee "$RUNNER_TEMP/test-build.log"
          fi

      # ---- 断言产物架构 --------------------------------------------------------
      # 为什么需要（不是装饰）：arm64 Windows runner 带 **x64 仿真** —— 工具链配置不当
      # （target 没传下去 / 拿错 triplet）时构建会**悄悄**产出 x64 二进制，而它在 arm64 上
      # 照样能跑，于是 ctest 全绿却什么也没证明。这条直接读 PE 头，一眼定架构。
      # 用 od 而不是 dumpbin：后者要先把 VS 环境摆好，而这个断言要能在**任何**一步失败后
      # 用最少的前提跑起来。
      #
      # ★ 产物路径 = example_embed/node.exe（**不是** app/node.exe）。
      #   2026-10-14 run #40 实测踩过：`app/` 是 test/ 目录按 example_ / test_ 重排
      #   （提交 3b77455）**之前**的布局，重排后已经没有这个目录，于是两个 Windows 腿
      #   编译明明跑满 `[20/20] Linking …` 却在这里红：
      #       ::error::test/build/windows-clang-cl/app/node.exe 不存在，无法断言架构
      #   node.exe 由 test/example_embed/ 生成（node_embed 目标 + OUTPUT_NAME node），
      #   所以路径跟着 example_embed/ 走。
      #   找不到时退到全树 find，并把实际存在的可执行列出来 —— 这样下一次目录再变，
      #   日志会直接告诉你该指向哪，而不是只说一句"不存在"。
      - name: 断言产物架构（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          want="${{ inputs.expect_arch }}"
          root="test/build/${{ inputs.preset }}"
          exe="$root/example_embed/node.exe"
          if [ ! -f "$exe" ]; then
            exe="$(find "$root" -maxdepth 2 -type f -iname 'node.exe' 2>/dev/null | head -1 || true)"
          fi
          if [ -z "$exe" ] || [ ! -f "$exe" ]; then
            echo "::error::$root 下找不到 node.exe，无法断言架构。实际布局："
            find "$root" -maxdepth 2 -type f -iname 'node*' 2>/dev/null | head -20 || true
            exit 1
          fi
          # PE：e_lfanew（4 字节，偏移 0x3C）指向 "PE\0\0"，其后 2 字节是 Machine。
          e_lfanew=$(od -An -tu4 -j 60 -N 4 "$exe" | tr -d ' ')
          sig=$(od -An -tx1 -j "$e_lfanew" -N 4 "$exe" | tr -d ' \n')
          machine=$(od -An -tx2 -j $((e_lfanew + 4)) -N 2 "$exe" | tr -d ' ')
          if [ "$sig" != "50450000" ]; then
            echo "::error::$exe 不是 PE 文件（签名读出 $sig）"
            exit 1
          fi
          case "$machine" in
            8664) got="x64" ;;
            aa64) got="ARM64" ;;
            014c) got="x86" ;;
            01c4) got="ARM" ;;
            *)    got="0x$machine" ;;
          esac
          echo "$exe：Machine=0x$machine（$got），期望 $want"
          if [ "$got" != "$want" ]; then
            echo "::error::产物架构不对：$got != $want。arm64 runner 带 x64 仿真，x64 产物也能跑 —— 必须在这里挡住。"
            exit 1
          fi

      # ---- 披露实际构建配置（评审 S5 / G8）------------------------------------
      # 为什么：文档里写"与官方构建等价"是可疑的 —— 关键是**实际**用了什么。这里把两样
      #   权威来源写进 job summary：
      #     ① 编出来的 node 自己报的 `process.config`（开了哪些特性一目了然）；
      #     ② node 的 config.gypi（gyp 的真正输入：host_arch / target_arch / node_shared_*
      #        / snapshot / code-cache 等）。
      #   比"把 configure 命令行抄进文档"更硬：命令行只说明"传了什么"，config.gypi 说明
      #   "**最后生效的是什么**"。
      - name: 披露实际构建配置（process.config / config.gypi）
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          # 与上面的架构断言同一套解析（优先 example_embed/，退到全树 find）。
          # run #40 实测：这两处曾各写一份 app/node.exe，而**带 `[ -f ] ||` 的那处
          # 静默跳过** ⇒ run 页面上从来没出现过 process.config，路径早已失效却没人发现。
          root="test/build/${{ inputs.preset }}"
          exe="$root/example_embed/node.exe"
          [ -f "$exe" ] || exe="$root/example_embed/node"
          if [ ! -f "$exe" ]; then
            exe="$(find "$root" -maxdepth 2 -type f -iname 'node' 2>/dev/null | head -1 || true)"
          fi
          {
            echo "## ${{ inputs.triplet }} 实际构建配置"
            echo '```'
            echo "--- process.config（编出来的 node 自己报的）---"
            if [ -n "$exe" ] && [ -f "$exe" ]; then
              echo "# 可执行：$exe"
              "$exe" -p "process.config" 2>&1 | head -40 || echo "(读不到 process.config)"
            else
              echo "(没找到 node 可执行，跳过)"
            fi
            echo ""
            echo "--- config.gypi 里的关键变量 ---"
            gypi="$(ls "$VCPKG_ROOT"/buildtrees/node/src/*/config.gypi 2>/dev/null | head -1)"
            if [ -n "$gypi" ]; then
              grep -aE "'(host_arch|target_arch|node_shared_[a-z_]+|node_use_node_snapshot|node_code_cache|v8_enable_lite_mode|node_with_ltcg)'" "$gypi" | head -30 || true
            else
              echo "(没有 config.gypi)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 列出将要跑的 ctest 用例
        shell: bash
        run: |
          set -euo pipefail
          # -V：把**完整命令行**也写进 ctest-list.txt —— run #34 里套件在"列用例"阶段就
          # 抛 re.PatternError 而死，而日志里看不到 test.py 的真实 argv，判读卡了很久。
          ctest --test-dir "test/build/${{ inputs.preset }}" -N -V | tee "$RUNNER_TEMP/ctest-list.txt"

      - name: 开始记录提交量水位（Windows；判读 0xC0000409 用）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # run #32 的 0xC0000409 是**提交量耗尽**（V8 自带 abseil 的
          # VirtualAlloc(MEM_RESERVE|MEM_COMMIT) 失败，见 tools/commit-watch.ps1 顶部），
          # 所以把 \Memory\Committed Bytes / Commit Limit 全程采下来。
          # 有这条，下一轮不管绿不绿都能回答"当时的余量到底有多少"。
          Start-Process -FilePath pwsh -WindowStyle Hidden -ArgumentList @(
            '-NoProfile', '-File', (Join-Path $env:GITHUB_WORKSPACE 'tools/commit-watch.ps1'),
            '-Output', (Join-Path $env:RUNNER_TEMP 'commit-samples.txt'),
            '-StopFile', (Join-Path $env:RUNNER_TEMP 'commit-watch.on'))
          Start-Sleep -Seconds 2
          Write-Host "提交量采样已启动"

      - name: 跑 ctest（smoke + unit + coexist + node 官方套件 + 符号审计）
        shell: bash
        run: |
          # pipefail：让失败通过 tee 传出来（否则管道最后一段的退出码会把它吃掉）
          set -o pipefail
          ctest --test-dir "test/build/${{ inputs.preset }}" \
                --output-on-failure \
                -j "${VCPKG_MAX_CONCURRENCY}" \
                2>&1 | tee "$RUNNER_TEMP/ctest.log"

      - name: ctest 摘要进 job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ inputs.triplet }} ctest 摘要"
            echo ""
            # ★ 先把**统计行**单独提到最前面：评审 B6 要的是"完整通过率"，而 tail -n 80
            #   有可能把它截掉（套件输出很长），看的人反而看不到结论。
            echo "**统计：**"
            echo '```'
            grep -aE "tests passed|Total Test time" "$RUNNER_TEMP/ctest.log" 2>/dev/null || echo "(没有 ctest.log / 没跑起来)"
            echo '```'
            echo ""
            echo "**失败用例列表：**"
            echo '```'
            sed -n '/The following tests FAILED/,/Errors while running CTest/p' "$RUNNER_TEMP/ctest.log" 2>/dev/null || echo "(无)"
            echo '```'
            echo ""
            echo "<details><summary>ctest 末尾 80 行</summary>"
            echo ""
            echo '```'
            tail -n 80 "$RUNNER_TEMP/ctest.log" 2>/dev/null || echo "(没有 ctest.log)"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 首错写进 job summary
        if: always()
        shell: bash
        run: |
          # run 页面上直接能看，不必下载任何东西。
          summary="$RUNNER_TEMP/first-error.txt"
          : > "$summary"
          for f in "$VCPKG_ROOT"/buildtrees/*/*-out.log; do
            [ -f "$f" ] || continue
            if grep -q -E "error:|fatal error|^FAILED|Error [0-9]+|LNK[0-9]+" "$f" 2>/dev/null; then
              {
                echo "===== $f ====="
                grep -n -m 30 -E "error:|fatal error|^FAILED|Error [0-9]+|LNK[0-9]+" "$f" || tail -n 80 "$f"
              } >> "$summary"
            fi
          done
          # ★ test 工程的构建输出也扫进来 —— 它不在 buildtrees 下，之前扫不到，
          #   于是 job 红了而"首错"却说没问题（run #18 实测）。
          if [ -f "$RUNNER_TEMP/test-build.log" ]; then
            if grep -q -E "error:|fatal error|^FAILED|Error [0-9]+|LNK[0-9]+" "$RUNNER_TEMP/test-build.log" 2>/dev/null; then
              {
                echo "===== test-build.log ====="
                grep -n -m 30 -E "error:|fatal error|^FAILED|Error [0-9]+|LNK[0-9]+" "$RUNNER_TEMP/test-build.log" || tail -n 80 "$RUNNER_TEMP/test-build.log"
              } >> "$summary"
            fi
          fi
          if [ -s "$summary" ]; then
            cat "$summary"
            {
              echo "## ${{ inputs.triplet }} 首错"
              echo '```'
              head -n 120 "$summary"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "没有匹配到错误行（若本 job 成功属正常）"
          fi

      - name: 收集日志
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          for f in "$RUNNER_TEMP/test-build.log" "$RUNNER_TEMP/ctest.log" "$RUNNER_TEMP/ctest-list.txt"; do
            [ -f "$f" ] && cp "$f" "$RUNNER_TEMP/ci-logs/" || true
          done
          for f in "$VCPKG_ROOT"/buildtrees/*/*.log; do
            [ -f "$f" ] || continue
            port="$(basename "$(dirname "$f")")"
            cp "$f" "$RUNNER_TEMP/ci-logs/${port}_$(basename "$f")"
          done
          {
            echo "=== vcpkg version ==="
            vcpkg version 2>&1 || true
            echo "=== triplet ==="
            echo "${{ inputs.triplet }}"
            echo "=== preset ==="
            echo "${{ inputs.preset }}"
            echo "=== compiler ==="
            cc --version 2>&1 || true
            c++ --version 2>&1 || true
            clang-cl --version 2>&1 || true
            echo "=== installed libs ==="
            # 清单模式下产物在 test/vcpkg_installed/<triplet>/（不是 $VCPKG_ROOT/installed）。
            ls -la "test/vcpkg_installed/${{ inputs.triplet }}/lib/" 2>&1 || true
            echo "=== installed node-config ==="
            sed -n '1,80p' \
              "test/vcpkg_installed/${{ inputs.triplet }}/share/unofficial-node/unofficial-node-config.cmake" \
              2>&1 || true
            echo "=== disk space ==="
            df -h 2>&1 || true
          } > "$RUNNER_TEMP/ci-logs/env_info.txt"
          # ctest 的输出与用例清单也一起进归档（它们是"结论"，比 buildtrees 更常被翻）
          for f in ctest.log ctest-list.txt; do
            [ -f "$RUNNER_TEMP/$f" ] && cp "$RUNNER_TEMP/$f" "$RUNNER_TEMP/ci-logs/$f"
          done
          # 停掉提交量采样并汇总（Windows）。最低剩余 = 最危险的时刻，判 0xC0000409 就看它。
          if [ -f "$RUNNER_TEMP/commit-watch.on" ]; then
            rm -f "$RUNNER_TEMP/commit-watch.on"
            sleep 6
            if [ -f "$RUNNER_TEMP/commit-samples.txt" ]; then
              cp "$RUNNER_TEMP/commit-samples.txt" "$RUNNER_TEMP/ci-logs/"
              echo "=== 提交量水位（列：时间 已提交GB 上限GB 剩余GB）==="
              echo "样本数 $(wc -l < "$RUNNER_TEMP/commit-samples.txt")，最低剩余 $(awk 'NF==4 {print $4}' "$RUNNER_TEMP/commit-samples.txt" | sort -n | head -1) GB"
              tail -n 20 "$RUNNER_TEMP/commit-samples.txt"
            fi
          fi
          echo "收集了 $(ls -1 "$RUNNER_TEMP/ci-logs" | wc -l) 个文件"

      - name: 上传本 job 的日志（中间产物）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-part-${{ inputs.triplet }}
          path: ${{ runner.temp }}/ci-logs
          if-no-files-found: error
          retention-days: 2

  # ---------------------------------------------------------------------------
  # 汇总日志：把各平台的日志合成**一个**归档 —— 下载一次就够。
  # ---------------------------------------------------------------------------
