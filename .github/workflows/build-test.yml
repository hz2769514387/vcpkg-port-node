name: Build and test the node port

# The shared body of every build in this repository: check out the pinned vcpkg, let the
# consumer test project build the port through it, then run ctest. Called by ci.yml,
# debug.yml and node-suite.yml, so they never drift apart.
#
# Everything here uses the public consumption path on purpose - overlay ports, a manifest,
# a triplet that ships with vcpkg, `find_package(unofficial-node CONFIG)`. If the port only
# builds when driven in some special way, this is where that would show up.
#
# The triplets named by the callers are vcpkg's own, its `*-release` *community* triplets
# included - those are the stock settings plus `VCPKG_BUILD_TYPE release`, and that one line
# is what keeps a leg from building Release *and* Debug, which would double its wall-clock
# time. This repository carries no triplet file of its own.
#
# A leg runs either as one job or as two, because a dual-triplet install can exceed one job's
# six-hour ceiling while neither half does:
#
#   * `split-install: false` (the default) - one job does everything. A release-only install
#     is minutes, so splitting it would only add an artifact transfer.
#   * `split-install: true` - an `install` job builds the port and uploads the installed
#     tree, and a `build` job downloads it, builds the consumer and runs the tests. Used by
#     the Linux Debug legs, whose dual-triplet install alone is around five hours. The tree
#     is a few gigabytes, which is why this is not the default.
#
# The setup and the configure step live in composite actions (.github/actions/) instead of
# inline, because both jobs run them and a copy would drift. Their bodies are the same text
# that used to be here.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner image to use.
        required: true
        type: string
      preset:
        description: Name of the CMake configure/build preset in test/CMakePresets.json.
        required: true
        type: string
      triplet:
        description: vcpkg triplet to install with, which is what decides the build configuration.
        required: true
        type: string
      consumer-configs:
        description: "Comma-separated consumer build configurations to build and test in this leg, e.g. 'Release,RelWithDebInfo'. One port install serves all of them, which is the whole reason to loop here instead of opening one leg per configuration."
        required: false
        type: string
        default: Release
      suite-configs:
        description: "Comma-separated subset of consumer-configs that also runs Node.js's own suite. The rest run with -LE node-suite. Empty means no configuration runs the suite."
        required: false
        type: string
        default: ""
      expect-arch:
        description: "Architecture the built consumer executable must have: x64 / ARM64 / x86 / ARM on Windows (PE machine), x86_64 / arm64 on macOS (Mach-O). Empty skips the check."
        required: false
        type: string
        default: ""
      vcpkg-commit:
        description: "vcpkg commit to check out (ADR 0005: the pin is the checkout)."
        required: false
        type: string
        default: 9e593bb18ea69cc5095e012465dcd675a822ed0d
      experimental:
        description: "Mark the platform as unverified: a failing consumer build or test does not fail the run."
        required: false
        type: boolean
        default: false
      split-install:
        description: "Build the port in its own job and hand the installed tree to a second job, for a leg whose install alone is close to the six-hour ceiling."
        required: false
        type: boolean
        default: false
      install-timeout-minutes:
        description: "Job timeout for the install job of a split leg. 360 is GitHub's ceiling for any job."
        required: false
        type: number
        default: 360
      install-only:
        description: "Run the install job and nothing else: install the port, upload no tree, run no consumer. Its product is the vcpkg binary-cache entry it saves when it ends, so a leg that `needs:` it re-installs in minutes instead of hours. Used by the Linux x64 Debug cell."
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: Job timeout. A dual-configuration (Debug) leg on a slow runner needs more than the default.
        required: false
        type: number
        default: 300

permissions:
  contents: read

jobs:
  install:
    # The expensive half of a split leg - a dual triplet builds Node.js twice - and the whole
    # reason the split exists, since the six-hour limit applies per job, not per leg.
    #
    # **No leg uses this today**, so it is skipped everywhere: the only caller was the two Linux
    # Debug legs, and those are gone (docs/ci.md, "Debug is verified on four cells"). It is kept
    # because a larger runner would want exactly this shape, and because the two lessons about
    # it are written down there - the artifact has to be a tar if anything relies on file
    # modes, and the saving is bounded. Delete it together with the input if nothing has used
    # it by the time a bigger runner is clearly not coming.
    #
    # Deliberately *not* continue-on-error, whatever `experimental` says: a leg whose install
    # failed has nothing to consume, and letting this job report success would hand an empty
    # or stale tree to the consumer job and turn a clear failure into a confusing one.
    if: ${{ inputs.split-install || inputs.install-only }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.install-timeout-minutes }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      # The GitHub Actions binary cache provider (x-gha) was removed from vcpkg, and
      # `clear;x-gha,readwrite` therefore silently disables caching entirely - it prints a
      # warning and builds every dependency from source on every run. The supported
      # replacement without new secrets is a plain files provider, persisted by the cache
      # step inside the prepare action.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-archives,readwrite
      VCPKG_MAX_CONCURRENCY: 3
      # English diagnostics from MSVC's tools: gyp decodes their output as UTF-8, and a
      # localized message turns a real link failure into a UnicodeDecodeError (docs/build.md).
      VSLANG: 1033
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the leg
        uses: ./.github/actions/prepare
        with:
          runner: ${{ inputs.runner }}
          preset: ${{ inputs.preset }}
          triplet: ${{ inputs.triplet }}
          consumer-configs: ${{ inputs.consumer-configs }}
          suite-configs: ${{ inputs.suite-configs }}
          vcpkg-commit: ${{ inputs.vcpkg-commit }}
          # Evaluated here, after the checkout, and handed in: hashFiles is not something to
          # rely on inside a composite action.
          manifest-hash: ${{ hashFiles('ports/**', 'test/vcpkg.json') }}
      # One step for both jobs. A release-only variant was tried and removed: neither an `env:`
      # on the step nor an input exported inside the action reached vcpkg, which went on to build
      # both configurations (run 39534901582 printed "vcpkg: VCPKG_BUILD_TYPE=release" and the
      # port answered "-- node port: VCPKG_BUILD_TYPE unset -> building Release + Debug"). The
      # `install-only` job is therefore a full install whose product is the binary cache entry,
      # and the leg that follows it installs from that cache in minutes.
      - name: Configure the consumer test project
        uses: ./.github/actions/configure
        with:
          preset: ${{ inputs.preset }}
          triplet: ${{ inputs.triplet }}
          config: ${{ inputs.consumer-configs }}
      - name: Summarize the run
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "## ${{ inputs.triplet }} (consumer ${{ inputs.consumer-configs }}, suite on ${{ inputs.suite-configs }})"
            echo ""
            echo '```'
            # The pass/fail counts go first: they are the whole answer to "did this leg work",
            # and they are easy to miss at the end of a few thousand lines.
            # One log per configuration, so the counts are read out of all of
            # them; a leg that builds three configurations and reports one is
            # not reporting what it did.
            for f in "$RUNNER_TEMP"/ci-logs/ctest-*.log; do
              [ -f "$f" ] || continue
              echo "-- $(basename "$f")"
              grep -E "tests passed|tests failed|Total Test time" "$f" | head -n 5 || true
              awk '/The following tests FAILED/{found=1} found' "$f" | head -n 40 || true
            done
            echo '```'
            # The first error, from whichever stream failed first: the port's own diagnostics
            # live in vcpkg's buildtrees, the consumer's in the tee'd logs.
            echo ""
            echo '### First error'
            echo '```'
            {
              grep -m1 -hE "error|Error" "$RUNNER_TEMP/ci-logs"/*.log 2>/dev/null || true
              for f in $(find vcpkg/buildtrees -name '*.log' -type f 2>/dev/null | head -n 100); do
                if grep -m1 -hE "error:|CMake Error|BUILD_FAILED" "$f" 2>/dev/null; then break; fi
              done
            } | head -n 15
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect the logs
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/ci-logs/vcpkg"
          # The port's own stdout and stderr are separate files in vcpkg's buildtrees
          # (build-<config>-out.log / -err.log), and the manifest log embeds only one of them.
          # Without them a diagnostic printed to the other stream is lost.
          while IFS= read -r f; do
            cp "$f" "$RUNNER_TEMP/ci-logs/vcpkg/$(echo "$f" | tr '/\\' '__')" 2>/dev/null || true
          done < <(find vcpkg/buildtrees -name '*.log' -type f 2>/dev/null | head -n 200)
          # The consumer build's own CMake logs, which are not under buildtrees.
          while IFS= read -r f; do
            cp "$f" "$RUNNER_TEMP/ci-logs/$(echo "$f" | tr '/\\' '__')" 2>/dev/null || true
          done < <(find test/build -name '*.log' -type f 2>/dev/null | head -n 200)
          du -sh "$RUNNER_TEMP/ci-logs" || true
          ls -la "$RUNNER_TEMP/ci-logs" || true

      - name: Pack the installed tree
        # A warm-up's tree is release-only and is thrown away; only the binary cache it filled
        # matters, and that is saved by the cache action's post step.
        if: ${{ !inputs.install-only }}
        shell: bash
        run: |
          set -euo pipefail
          # A tar inside the artifact, not the artifact's own zip of a directory: zip carries no
          # POSIX mode bits, and a round trip through it dropped the executable bit on the test
          # suite's `test/fixtures/run-script/node_modules/.bin/ada` fixture - the consumer job
          # then refused to configure with "test suite fixture lost its executable bit"
          # (measured, run 39500147659). tar keeps the modes, and the artifact only ever sees
          # one file.
          tar -cf "$RUNNER_TEMP/port-install.tar"             -C "test/build/${{ inputs.preset }}/vcpkg_installed" .
          ls -lh "$RUNNER_TEMP/port-install.tar"

      - name: Upload the installed tree
        if: ${{ !inputs.install-only }}
        uses: actions/upload-artifact@v4
        with:
          # Not `logs-part-*`: that pattern is what logs.yml merges into the run's log
          # archive, and a few gigabytes of libraries do not belong in a log archive.
          name: port-install-${{ inputs.triplet }}
          path: ${{ runner.temp }}/port-install.tar
          if-no-files-found: error
          # Compressed, not stored. A dual Debug install runs to several gigabytes - libnode
          # and the v8 archives are object files with debug information, twice - and the
          # artifact cap is 10 GB, so "store only" is a guess that this leg happens to be
          # small enough. It also compresses unusually well for its size.
          compression-level: 6
          retention-days: 1

      - name: Upload this leg's logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Named so that the merge job in every calling workflow picks all legs up with one
          # pattern: one archive per run, not one per platform.
          # `warm` or `install` in the name: a warm-up and the install job of the same leg
          # both run, and upload-artifact@v4 refuses two artifacts with one name.
          name: logs-part-${{ inputs.install-only && 'warm' || 'install' }}-${{ inputs.triplet }}
          path: ${{ runner.temp }}/ci-logs
          if-no-files-found: warn
          retention-days: 7

  build:
    needs: install
    # Runs when the install job was skipped (the leg is not split) and when it succeeded.
    # Not when it failed or the run was cancelled: `needs` would let it start, and it would
    # then build against nothing.
    if: ${{ !cancelled() && !inputs.install-only && needs.install.result != 'failure' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # continue-on-error has to live here rather than on the caller: a job that calls a
    # reusable workflow does not accept it - the file is accepted and then produces a run
    # with zero jobs and "this run likely failed because of a workflow file issue".
    continue-on-error: ${{ inputs.experimental }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      # The GitHub Actions binary cache provider (x-gha) was removed from vcpkg, and
      # `clear;x-gha,readwrite` therefore silently disables caching entirely - it prints a
      # warning and builds every dependency from source on every run. The supported
      # replacement without new secrets is a plain files provider, persisted by the cache
      # step inside the prepare action.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-archives,readwrite
      VCPKG_MAX_CONCURRENCY: 3
      # English diagnostics from MSVC's tools: gyp decodes their output as UTF-8, and a
      # localized message turns a real link failure into a UnicodeDecodeError (docs/build.md).
      VSLANG: 1033
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the leg
        uses: ./.github/actions/prepare
        with:
          runner: ${{ inputs.runner }}
          preset: ${{ inputs.preset }}
          triplet: ${{ inputs.triplet }}
          consumer-configs: ${{ inputs.consumer-configs }}
          suite-configs: ${{ inputs.suite-configs }}
          vcpkg-commit: ${{ inputs.vcpkg-commit }}
          # Evaluated here, after the checkout, and handed in: hashFiles is not something to
          # rely on inside a composite action.
          manifest-hash: ${{ hashFiles('ports/**', 'test/vcpkg.json') }}
      - name: Download the installed tree
        if: ${{ inputs.split-install }}
        uses: actions/download-artifact@v4
        with:
          name: port-install-${{ inputs.triplet }}
          path: ${{ runner.temp }}/port-install

      - name: Unpack the installed tree
        if: ${{ inputs.split-install }}
        shell: bash
        run: |
          set -euo pipefail
          # The same absolute path the install job used. It has to be: vcpkg's status entries
          # and the exported CMake configs carry absolute paths, and the runner's workspace
          # path is the same in both jobs for the same repository. `tar -x` restores the modes
          # the install job had, which is the reason this is a tar at all.
          target="test/build/${{ inputs.preset }}/vcpkg_installed"
          mkdir -p "$target"
          tar -xf "$RUNNER_TEMP/port-install/port-install.tar" -C "$target"
          # Assert the mode survived, rather than listing a path: the tar exists because a zip
          # round trip dropped the executable bit (run 39500147659), and the first version of
          # this step hard-coded a fixture path and failed on a path that had moved (run
          # 39534901582). `find` asks the tree where the fixtures are.
          # `-print -quit`, not `| head -n 1`: under `set -o pipefail` the head closing the pipe
          # sends find a SIGPIPE, the pipeline fails and `set -e` aborts the step - which is
          # exactly how this failed in run 39535015717 after a successful 4.8 GB extraction.
          bin=$(find "$target/share/node/test-suite" -path '*/.bin/*' -type f -print -quit 2>/dev/null || true)
          if [ -z "$bin" ]; then
            echo "::warning::no .bin fixture in the installed test suite; not asserting modes"
          else
            echo "fixture mode: $(stat -c '%A' "$bin") $bin"
            [ -x "$bin" ] || {
              echo "::error::the installed test suite lost its executable bit on $bin"
              exit 1
            }
          fi
      - name: Configure the consumer test project
        uses: ./.github/actions/configure
        with:
          preset: ${{ inputs.preset }}
          triplet: ${{ inputs.triplet }}
          config: ${{ inputs.consumer-configs }}
      - name: Build the consumer test project
        shell: bash
        working-directory: test
        env:
          PRESET: ${{ inputs.preset }}
          TRIPLET: ${{ inputs.triplet }}
          CONFIGS: ${{ inputs.consumer-configs }}
        run: |
          set -euo pipefail
          # One install of the port serves every configuration, so the loop is
          # the cheap part - the port is built once, above.
          #
          # Reconfigured per configuration because a single-config generator
          # (Ninja, Makefiles) fixes CMAKE_BUILD_TYPE at configure time and
          # builds one tree per value; on a multi-config one the reconfigure is
          # a no-op that costs seconds and every configuration already exists
          # in the same tree.
          IFS=',' read -r -a cfgs <<< "$CONFIGS"
          for cfg in "${cfgs[@]}"; do
            echo "::group::consumer configuration $cfg"
            cmake --preset "$PRESET" \
                -DVCPKG_TARGET_TRIPLET="$TRIPLET" \
                -DCMAKE_BUILD_TYPE="$cfg"
            # tee'd as well: the port's own output lands in vcpkg's buildtrees, but this
            # step's output is the consumer's, and the first-error summary reads both.
            cmake --build --preset "$PRESET" --config "$cfg" 2>&1 \
              | tee "$RUNNER_TEMP/ci-logs/build-$cfg.log"
            echo "::endgroup::"
          done
      - name: Assert the architecture of the built executable
        if: ${{ inputs.expect-arch != '' }}
        shell: bash
        working-directory: test
        env:
          PRESET: ${{ inputs.preset }}
          CONFIGS: ${{ inputs.consumer-configs }}
          EXPECT_ARCH: ${{ inputs.expect-arch }}
        run: |
          set -euo pipefail
          # Why this exists (it is not decoration): an arm64 Windows runner can execute x64
          # binaries through emulation, and an arm64 macOS runner can execute x86_64 binaries
          # through Rosetta. A build that silently produced the wrong machine type would
          # therefore run perfectly and pass every ctest case while proving nothing. This
          # reads the file itself, which needs no toolchain and no developer environment, so
          # it still works after an earlier step has broken the environment.
          IFS=',' read -r -a cfgs <<< "$CONFIGS"
          for cfg in "${cfgs[@]}"; do
          exe=""
          for cand in "build/$PRESET/embedder/$cfg/node_embed.exe" \
                      "build/$PRESET/embedder/node_embed.exe" \
                      "build/$PRESET/embedder/node_embed"; do
            if [ -f "$cand" ]; then exe="$cand"; break; fi
          done
          if [ -z "$exe" ]; then
            exe="$(find "build/$PRESET" -type f -name 'node_embed*' 2>/dev/null | head -1 || true)"
          fi
          if [ -z "$exe" ] || [ ! -f "$exe" ]; then
            echo "::error::no embedder executable under build/$PRESET to check the architecture of. What is there:"
            find "build/$PRESET" -maxdepth 4 -type f -name 'node_embed*' 2>/dev/null | head -20 || true
            exit 1
          fi

          if [ "$RUNNER_OS" = "macOS" ]; then
            # Mach-O: `file` prints e.g. "Mach-O 64-bit executable x86_64".
            description="$(file -b "$exe")"
            case "$description" in
              *x86_64*) got="x86_64" ;;
              *arm64*)  got="arm64" ;;
              *)        got="$description" ;;
            esac
            detail="$description"
          else
            # PE: e_lfanew at 0x3C is the offset of the signature, Machine the first word
            # after it. od reads two bytes as a host-endian 16-bit value, so a little-endian
            # file prints the machine code in readable order (x64 -> 8664, arm64 -> aa64).
            pe_off="$(od -An -tu4 -j60 -N4 "$exe" | tr -d ' \n')"
            machine="$(od -An -tx2 -j"$((pe_off + 4))" -N2 "$exe" | tr -d ' \n')"
            case "$machine" in
              8664) got="x64" ;;
              aa64) got="ARM64" ;;
              014c) got="x86" ;;
              01c4) got="ARM" ;;
              *)    got="0x$machine" ;;
            esac
            detail="PE Machine 0x$machine"
          fi

          echo "$exe ($cfg): $detail -> $got (expected $EXPECT_ARCH)"
          if [ "$got" != "$EXPECT_ARCH" ]; then
            echo "::error::the built executable is $got, not $EXPECT_ARCH. An arm64 runner emulates or translates the other architecture, so a wrong-architecture build still runs and its tests still pass - it has to be caught here."
            exit 1
          fi
          done
      - name: Run the tests
        shell: bash
        working-directory: test
        env:
          PRESET: ${{ inputs.preset }}
          CONFIGS: ${{ inputs.consumer-configs }}
          SUITE_CONFIGS: ${{ inputs.suite-configs }}
        run: |
          set -euo pipefail
          # Node.js's own suite costs the better part of an hour, so it runs on
          # the configurations it says something about (the delivered Release,
          # and Debug where that is built) and not on every configuration a leg
          # builds. Everything else - the identity, embedding, symbol and zlib
          # cases - runs everywhere.
          #
          # suite-configs is empty on the Debug and matrix legs, and that used to abort this
          # step on macOS alone with "suitecfgs[@]: unbound variable": macOS still ships bash
          # 3.2 as /bin/bash, where expanding an *empty* array under `set -u` is an error
          # (bash 4.4 made it legal). Membership is therefore tested against the string, which
          # needs no array and behaves the same on every bash.
          : "${CONFIGS:=Release}"
          IFS=',' read -r -a cfgs <<< "$CONFIGS"
          for cfg in "${cfgs[@]}"; do
            opts="-LE node-suite"
            case ",${SUITE_CONFIGS:-}," in
              *",$cfg,"*) opts="" ;;
            esac
            echo "::group::ctest $cfg ($opts)"
            # -C is only meaningful for multi-config generators (Visual Studio); the
            # single-config ones ignore it.
            ctest --test-dir "build/$PRESET" -C "$cfg" --output-on-failure $opts \
              2>&1 | tee "$RUNNER_TEMP/ci-logs/ctest-$cfg.log"
            echo "::endgroup::"
          done
      - name: Summarize the run
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "## ${{ inputs.triplet }} (consumer ${{ inputs.consumer-configs }}, suite on ${{ inputs.suite-configs }})"
            echo ""
            echo '```'
            # The pass/fail counts go first: they are the whole answer to "did this leg work",
            # and they are easy to miss at the end of a few thousand lines.
            # One log per configuration, so the counts are read out of all of
            # them; a leg that builds three configurations and reports one is
            # not reporting what it did.
            for f in "$RUNNER_TEMP"/ci-logs/ctest-*.log; do
              [ -f "$f" ] || continue
              echo "-- $(basename "$f")"
              grep -E "tests passed|tests failed|Total Test time" "$f" | head -n 5 || true
              awk '/The following tests FAILED/{found=1} found' "$f" | head -n 40 || true
            done
            echo '```'
            # The first error, from whichever stream failed first: the port's own diagnostics
            # live in vcpkg's buildtrees, the consumer's in the tee'd logs.
            echo ""
            echo '### First error'
            echo '```'
            {
              grep -m1 -hE "error|Error" "$RUNNER_TEMP/ci-logs"/*.log 2>/dev/null || true
              for f in $(find vcpkg/buildtrees -name '*.log' -type f 2>/dev/null | head -n 100); do
                if grep -m1 -hE "error:|CMake Error|BUILD_FAILED" "$f" 2>/dev/null; then break; fi
              done
            } | head -n 15
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect the logs
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/ci-logs/vcpkg"
          # The port's own stdout and stderr are separate files in vcpkg's buildtrees
          # (build-<config>-out.log / -err.log), and the manifest log embeds only one of them.
          # Without them a diagnostic printed to the other stream is lost.
          while IFS= read -r f; do
            cp "$f" "$RUNNER_TEMP/ci-logs/vcpkg/$(echo "$f" | tr '/\\' '__')" 2>/dev/null || true
          done < <(find vcpkg/buildtrees -name '*.log' -type f 2>/dev/null | head -n 200)
          # The consumer build's own CMake logs, which are not under buildtrees.
          while IFS= read -r f; do
            cp "$f" "$RUNNER_TEMP/ci-logs/$(echo "$f" | tr '/\\' '__')" 2>/dev/null || true
          done < <(find test/build -name '*.log' -type f 2>/dev/null | head -n 200)
          du -sh "$RUNNER_TEMP/ci-logs" || true
          ls -la "$RUNNER_TEMP/ci-logs" || true

      - name: Upload this leg's logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Named so that the merge job in every calling workflow picks all legs up with one
          # pattern: one archive per run, not one per platform.
          name: logs-part-${{ inputs.triplet }}-${{ inputs.consumer-configs }}
          path: ${{ runner.temp }}/ci-logs
          if-no-files-found: warn
          retention-days: 7
