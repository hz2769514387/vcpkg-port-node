name: Build and test the node port

# The shared body of every build in this repository: check out the pinned vcpkg, let the
# consumer test project build the port through it, then run ctest. Called by ci.yml and
# node-suite.yml, so the two never drift apart.
#
# Everything here uses the public consumption path on purpose - overlay ports, a manifest, a
# stock triplet. If the port only builds when driven in some special way, this is where that
# would show up.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner image to use.
        required: true
        type: string
      preset:
        description: Name of the CMake configure/build preset in test/CMakePresets.json.
        required: true
        type: string
      triplet:
        description: vcpkg triplet, for the log header only - the preset already sets it.
        required: true
        type: string
      vcpkg-commit:
        description: "vcpkg commit to check out (ADR 0003: the baseline is pinned)."
        required: false
        type: string
        default: 9e593bb18ea69cc5095e012465dcd675a822ed0d
      ctest-options:
        description: Flags for ctest, e.g. "-LE node-suite" for the fast path.
        required: false
        type: string
        default: -LE node-suite
      experimental:
        description: "Mark the platform as unverified: failures are reported but do not fail the run."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300
    # continue-on-error has to live here rather than on the caller: a job that calls a
    # reusable workflow does not accept it - the file is accepted and then produces a run
    # with zero jobs and "this run likely failed because of a workflow file issue".
    continue-on-error: ${{ inputs.experimental }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      # The GitHub Actions binary cache provider (x-gha) was removed from vcpkg, and
      # `clear;x-gha,readwrite` therefore silently disables caching entirely - it prints a
      # warning and builds every dependency from source on every run. The supported
      # replacement without new secrets is a plain files provider, persisted by the cache
      # step below.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-archives,readwrite
      VCPKG_MAX_CONCURRENCY: 3
      # English diagnostics from MSVC's tools: gyp decodes their output as UTF-8, and a
      # localized message turns a real link failure into a UnicodeDecodeError (docs/build.md).
      VSLANG: 1033
    steps:
      - uses: actions/checkout@v4

      - name: Report the starting point
        shell: bash
        run: |
          echo "### Port build"
          echo "- runner: ${{ inputs.runner }}"
          echo "- preset: ${{ inputs.preset }} (triplet ${{ inputs.triplet }})"
          echo "- vcpkg: ${{ inputs.vcpkg-commit }}"
          echo "- ctest: ${{ inputs.ctest-options }}"
          echo ""
          echo "Free space before:"; df -h . || true

      - name: Restore the vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-archives
          # The key covers the vcpkg commit and the contents of ports/ plus the test
          # manifest: any of those changing changes the ABI of what gets built, so a stale
          # entry would restore the wrong binaries.
          key: vcpkg-${{ inputs.runner }}-${{ inputs.vcpkg-commit }}-${{ hashFiles('ports/**', 'test/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ inputs.runner }}-${{ inputs.vcpkg-commit }}-

      - name: Check out the pinned vcpkg
        shell: bash
        env:
          VCPKG_COMMIT: ${{ inputs.vcpkg-commit }}
        run: |
          set -euo pipefail
          mkdir -p "$VCPKG_ROOT"
          cd "$VCPKG_ROOT"
          git init --quiet
          git remote add origin https://github.com/microsoft/vcpkg.git
          git fetch --depth 1 origin "$VCPKG_COMMIT"
          git checkout --quiet FETCH_HEAD
          git rev-parse HEAD

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Toolchain inventory
        shell: bash
        run: |
          # Everything below is a hard requirement of the node port, and each one has failed
          # at least once somewhere: cargo for Node.js 26's Temporal crate, python for gyp and
          # for the official test driver, clang-cl on Windows (upstream requirement since 24).
          echo "cargo         : $(cargo --version || echo MISSING)"
          echo "python        : $(python --version 2>&1 || echo MISSING)"
          echo "python3       : $(python3 --version 2>&1 || echo MISSING)"
          echo "cmake         : $(cmake --version | head -n 1 || echo MISSING)"
          echo "ninja         : $(ninja --version 2>/dev/null || echo MISSING)"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "clang-cl      : $(command -v clang-cl || echo MISSING)"
          fi

      - name: Configure the consumer test project
        shell: bash
        working-directory: test
        env:
          PRESET: ${{ inputs.preset }}
        run: |
          set -euo pipefail
          # This is also what builds the port: vcpkg runs in manifest mode during configure.
          cmake --preset "$PRESET"

      - name: Build the consumer test project
        shell: bash
        working-directory: test
        env:
          PRESET: ${{ inputs.preset }}
        run: |
          set -euo pipefail
          cmake --build --preset "$PRESET"

      - name: Run the tests
        shell: bash
        working-directory: test
        env:
          PRESET: ${{ inputs.preset }}
          CTEST_OPTIONS: ${{ inputs.ctest-options }}
        run: |
          set -euo pipefail
          # -C is only meaningful for multi-config generators (Visual Studio); the
          # single-config ones ignore it.
          ctest --test-dir "build/$PRESET" -C Release --output-on-failure $CTEST_OPTIONS

      - name: Keep the logs when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.preset }}-${{ github.run_id }}
          # Both streams matter: vcpkg keeps a port's build stdout and stderr in separate
          # files (build-<config>-out.log / -err.log), and the manifest log only embeds one
          # of them. Without buildtrees, a diagnostic printed to the other stream is lost.
          path: |
            test/build/**/*.log
            vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore
          retention-days: 7
