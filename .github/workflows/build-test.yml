name: Build and test the node port

# The shared body of every build in this repository: check out the pinned vcpkg, let the
# consumer test project build the port through it, then run ctest. Called by ci.yml,
# debug.yml and node-suite.yml, so they never drift apart.
#
# Everything here uses the public consumption path on purpose - overlay ports, a manifest,
# a triplet that ships with vcpkg, `find_package(unofficial-node CONFIG)`. If the port only
# builds when driven in some special way, this is where that would show up.
#
# The triplets named by the callers are vcpkg's own, its `*-release` *community* triplets
# included - those are the stock settings plus `VCPKG_BUILD_TYPE release`, and that one line
# is what keeps a leg from building Release *and* Debug, which would double its wall-clock
# time. This repository carries no triplet file of its own.
#
# A leg is one job. It used to be able to run as two - an `install` job that built the port and
# uploaded the tree, and a `build` job that consumed it - because a dual-triplet install can exceed
# one job's six-hour ceiling while neither half does. The only legs that needed it were the Linux
# Debug ones, and they were removed instead: even split, the install is 5h36m on a four-core runner
# with every dependency cached, so it lands on either side of the ceiling depending on runner load.
# `docs/ci.md` §3 records the gap; `git log -- .github/workflows/build-test.yml` has the shape, if a
# runner with more cores ever makes it worth restoring.
#
# The setup and the configure step live in composite actions (.github/actions/) instead of
# inline, because both jobs run them and a copy would drift. Their bodies are the same text
# that used to be here.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner image to use.
        required: true
        type: string
      preset:
        description: Name of the CMake configure/build preset in test/CMakePresets.json.
        required: true
        type: string
      triplet:
        description: vcpkg triplet to install with, which is what decides the build configuration.
        required: true
        type: string
      consumer-configs:
        description: "Comma-separated consumer build configurations to build and test in this leg, e.g. 'Release,RelWithDebInfo'. One port install serves all of them, which is the whole reason to loop here instead of opening one leg per configuration."
        required: false
        type: string
        default: Release
      suite-configs:
        description: "Comma-separated subset of consumer-configs that also runs Node.js's own suite. The rest run with -LE node-suite. Empty means no configuration runs the suite."
        required: false
        type: string
        default: ""
      expect-arch:
        description: "Architecture the built consumer executable must have: x64 / ARM64 / x86 / ARM on Windows (PE machine), x86_64 / arm64 on macOS (Mach-O). Empty skips the check."
        required: false
        type: string
        default: ""
      vcpkg-commit:
        description: "vcpkg commit to check out (ADR 0005: the pin is the checkout)."
        required: false
        type: string
        default: 9eec002df1cd109f8f104cd966a763daf9751489
      experimental:
        description: "Mark the platform as unverified: a failing consumer build or test does not fail the run."
        required: false
        type: boolean
        default: false
      benchmark:
        description: "Also compare the built node against the official binary of the same version (startup plus a slice of Node.js's benchmark directory). Step 5 of the release checklist; on a quiet machine only, so nothing sets this on a push."
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: Job timeout. A dual-configuration (Debug) leg on a slow runner needs more than the default.
        required: false
        type: number
        default: 300

permissions:
  contents: read

jobs:

  build:
    # Runs when the install job was skipped (the leg is not split) and when it succeeded. Not when
    # it failed, and not when it was cancelled - a cancelled install is the six-hour platform limit
    # firing, and letting the build job start then turns "the install never finished" into
    # "artifact not found", which reads like a compile error and is not.
    if: ${{ !cancelled() && needs.install.result != 'failure' && needs.install.result != 'cancelled' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # continue-on-error has to live here rather than on the caller: a job that calls a
    # reusable workflow does not accept it - the file is accepted and then produces a run
    # with zero jobs and "this run likely failed because of a workflow file issue".
    continue-on-error: ${{ inputs.experimental }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      # The GitHub Actions binary cache provider (x-gha) was removed from vcpkg, and
      # `clear;x-gha,readwrite` therefore silently disables caching entirely - it prints a
      # warning and builds every dependency from source on every run. The supported
      # replacement without new secrets is a plain files provider, persisted by the cache
      # step inside the prepare action.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-archives,readwrite
      VCPKG_MAX_CONCURRENCY: 3
      # English diagnostics from MSVC's tools: gyp decodes their output as UTF-8, and a
      # localized message turns a real link failure into a UnicodeDecodeError (docs/build.md).
      VSLANG: 1033
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the leg
        uses: ./.github/actions/prepare
        with:
          runner: ${{ inputs.runner }}
          preset: ${{ inputs.preset }}
          triplet: ${{ inputs.triplet }}
          consumer-configs: ${{ inputs.consumer-configs }}
          suite-configs: ${{ inputs.suite-configs }}
          vcpkg-commit: ${{ inputs.vcpkg-commit }}
          # Evaluated here, after the checkout, and handed in: hashFiles is not something to
          # rely on inside a composite action.
          cache-hash: ${{ hashFiles('test/vcpkg.json') }}
      - name: Configure the consumer test project
        uses: ./.github/actions/configure
        with:
          preset: ${{ inputs.preset }}
          triplet: ${{ inputs.triplet }}
          config: ${{ inputs.consumer-configs }}
      - name: Build the consumer test project
        shell: bash
        working-directory: test
        env:
          PRESET: ${{ inputs.preset }}
          TRIPLET: ${{ inputs.triplet }}
          CONFIGS: ${{ inputs.consumer-configs }}
        run: |
          set -euo pipefail
          # One install of the port serves every configuration, so the loop is
          # the cheap part - the port is built once, above.
          #
          # Reconfigured per configuration because a single-config generator
          # (Ninja, Makefiles) fixes CMAKE_BUILD_TYPE at configure time and
          # builds one tree per value; on a multi-config one the reconfigure is
          # a no-op that costs seconds and every configuration already exists
          # in the same tree.
          IFS=',' read -r -a cfgs <<< "$CONFIGS"
          for cfg in "${cfgs[@]}"; do
            echo "::group::consumer configuration $cfg"
            cmake --preset "$PRESET" \
                -DVCPKG_TARGET_TRIPLET="$TRIPLET" \
                -DCMAKE_BUILD_TYPE="$cfg"
            # tee'd as well: the port's own output lands in vcpkg's buildtrees, but this
            # step's output is the consumer's, and the first-error summary reads both.
            cmake --build --preset "$PRESET" --config "$cfg" 2>&1 \
              | tee "$RUNNER_TEMP/ci-logs/build-$cfg.log"
            echo "::endgroup::"
          done
      - name: Compare against the official binary
        if: ${{ inputs.benchmark && runner.os == 'Linux' }}
        shell: bash
        env:
          PRESET: ${{ inputs.preset }}
          TRIPLET: ${{ inputs.triplet }}
        run: |
          set -euo pipefail
          chmod +x tools/benchmark_compare.sh
          tools/benchmark_compare.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Assert the architecture of the built executable
        if: ${{ inputs.expect-arch != '' }}
        shell: bash
        working-directory: test
        env:
          PRESET: ${{ inputs.preset }}
          CONFIGS: ${{ inputs.consumer-configs }}
          EXPECT_ARCH: ${{ inputs.expect-arch }}
        run: |
          set -euo pipefail
          # Why this exists (it is not decoration): an arm64 Windows runner can execute x64
          # binaries through emulation, and an arm64 macOS runner can execute x86_64 binaries
          # through Rosetta. A build that silently produced the wrong machine type would
          # therefore run perfectly and pass every ctest case while proving nothing. This
          # reads the file itself, which needs no toolchain and no developer environment, so
          # it still works after an earlier step has broken the environment.
          IFS=',' read -r -a cfgs <<< "$CONFIGS"
          for cfg in "${cfgs[@]}"; do
          exe=""
          for cand in "build/$PRESET/cases/embed/$cfg/node_embed.exe" \
                      "build/$PRESET/cases/embed/node_embed.exe" \
                      "build/$PRESET/cases/embed/node_embed"; do
            if [ -f "$cand" ]; then exe="$cand"; break; fi
          done
          if [ -z "$exe" ]; then
            # node_embed.exe, not node_embed*: an MSVC build leaves node_embed.lib and .exp beside it,
            # and asserting the architecture of an import library reports "not a PE file" as if the
            # build were wrong.
            exe="$(find "build/$PRESET" -type f \( -name 'node_embed.exe' -o -name 'node_embed' \) \
                    2>/dev/null | head -1 || true)"
          fi
          if [ -z "$exe" ] || [ ! -f "$exe" ]; then
            echo "::error::no embedder executable under build/$PRESET to check the architecture of. What is there:"
            find "build/$PRESET" -maxdepth 5 -type f -name 'node_embed*' 2>/dev/null | head -20 || true
            exit 1
          fi

          if [ "$RUNNER_OS" = "macOS" ]; then
            # Mach-O: `file` prints e.g. "Mach-O 64-bit executable x86_64".
            description="$(file -b "$exe")"
            case "$description" in
              *x86_64*) got="x86_64" ;;
              *arm64*)  got="arm64" ;;
              *)        got="$description" ;;
            esac
            detail="$description"
          else
            # PE: e_lfanew at 0x3C is the offset of the signature, Machine the first word
            # after it. od reads two bytes as a host-endian 16-bit value, so a little-endian
            # file prints the machine code in readable order (x64 -> 8664, arm64 -> aa64).
            pe_off="$(od -An -tu4 -j60 -N4 "$exe" | tr -d ' \n')"
            machine="$(od -An -tx2 -j"$((pe_off + 4))" -N2 "$exe" | tr -d ' \n')"
            case "$machine" in
              8664) got="x64" ;;
              aa64) got="ARM64" ;;
              014c) got="x86" ;;
              01c4) got="ARM" ;;
              *)    got="0x$machine" ;;
            esac
            detail="PE Machine 0x$machine"
          fi

          echo "$exe ($cfg): $detail -> $got (expected $EXPECT_ARCH)"
          if [ "$got" != "$EXPECT_ARCH" ]; then
            echo "::error::the built executable is $got, not $EXPECT_ARCH. An arm64 runner emulates or translates the other architecture, so a wrong-architecture build still runs and its tests still pass - it has to be caught here."
            exit 1
          fi
          done
      - name: Run the tests
        shell: bash
        working-directory: test
        env:
          PRESET: ${{ inputs.preset }}
          CONFIGS: ${{ inputs.consumer-configs }}
          SUITE_CONFIGS: ${{ inputs.suite-configs }}
        run: |
          set -euo pipefail
          # Node.js's own suite costs the better part of an hour, so it runs on
          # the configurations it says something about (the delivered Release,
          # and Debug where that is built) and not on every configuration a leg
          # builds. Everything else - the identity, embedding, symbol and zlib
          # cases - runs everywhere.
          #
          # suite-configs is empty on the Debug and matrix legs, and that used to abort this
          # step on macOS alone with "suitecfgs[@]: unbound variable": macOS still ships bash
          # 3.2 as /bin/bash, where expanding an *empty* array under `set -u` is an error
          # (bash 4.4 made it legal). Membership is therefore tested against the string, which
          # needs no array and behaves the same on every bash.
          : "${CONFIGS:=Release}"
          IFS=',' read -r -a cfgs <<< "$CONFIGS"
          for cfg in "${cfgs[@]}"; do
            opts="-LE node-suite"
            case ",${SUITE_CONFIGS:-}," in
              *",$cfg,"*) opts="" ;;
            esac
            echo "::group::ctest $cfg ($opts)"
            # -C is only meaningful for multi-config generators (Visual Studio); the
            # single-config ones ignore it.
            ctest --test-dir "build/$PRESET" -C "$cfg" --output-on-failure $opts \
              2>&1 | tee "$RUNNER_TEMP/ci-logs/ctest-$cfg.log"
            echo "::endgroup::"
          done
      - name: Report the run
        uses: ./.github/actions/report
        with:
          triplet: ${{ inputs.triplet }}
          consumer-configs: ${{ inputs.consumer-configs }}
          suite-configs: ${{ inputs.suite-configs }}
      - name: Upload this leg's logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Named so that the merge job in every calling workflow picks all legs up with one
          # pattern: one archive per run, not one per platform.
          name: logs-part-${{ inputs.triplet }}-${{ inputs.consumer-configs }}
          path: ${{ runner.temp }}/ci-logs
          if-no-files-found: warn
          retention-days: 7
